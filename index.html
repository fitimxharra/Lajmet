// ===== KATEGORIZIMI =====
// Rendi i sigurisë: 1) feed kategorie  2) kategoritë RSS të vetë portalit
// 3) seksioni në URL  4) fjalë kyçe me pikë (vetëm si mundësi e fundit).
function norm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
}
const CAT_PRIORITY=["sport","culture","health","other","world","national"];
const LABEL_RX={
  health:/\b(shendet|shendeti|shendetesi|shendetesia|health|mjekesi|mjekesia)\b/,
  sport:/\b(sport|sporti|sportet|sportive|futboll|futbolli|football|basketboll|basketbolli|basket|volejboll|hendboll|handboll|tenis|superliga|superliga e kosoves|premier league|champions league|liga e kampioneve|la liga|serie a|bundesliga|ligue 1|formula 1|boks|mma|ufc|atletike|olimpiada|lojerat olimpike|kombetarja|nba|euroliga|transferime|arena)\b/,

  world:/\b(bote|bota|world|nderkombetare|nderkombetar|globale|rajoni|rajon|europa|evropa|amerika|lindja e mesme)\b/,

};
const URL_SEG={
  shendet:"health",shendeti:"health",shendetesi:"health",shendetesia:"health",health:"health",mjekesi:"health",
  "futboll-sporti":"sport","basketboll-sporti":"sport",sport:"sport",sporti:"sport",sportet:"sport",sportive:"sport",futboll:"sport",
  bote:"world",bota:"world",world:"world",globale:"world",rajoni:"world",rajon:"world",
  kulture:"culture",kultura:"culture",kulturore:"culture",art:"culture",
  showbiz:"other",magazina:"other",lifestyle:"other",tech:"other",teknologji:"other",
  lajme:"national",politike:"national",aktuale:"national",sociale:"national",ekonomi:"national",
  kosove:"national",kosova:"national",shqiperi:"national",opinion:"national"
};
function pickByPriority(found){ return CAT_PRIORITY.find(c=>found.includes(c))||null; }
function catFromLabels(labels){
  const found=[];
  labels.map(norm).forEach(l=>{ for(const c of CAT_PRIORITY) if(LABEL_RX[c].test(l)) found.push(c); });
  return pickByPriority(found);
}
function catFromUrl(url){
  try{
    const segs=new URL(url).pathname.split("/").filter(Boolean).map(norm);
    segs.pop(); // segmenti i fundit është titulli i artikullit, jo seksioni
    return pickByPriority(segs.map(s=>URL_SEG[s]).filter(Boolean));
  }catch{return null;}
}

  ],
  national:[
    [/\b(kosov|prishtin|kurti|osmani|shqiper|tiran|rama\b|mitrovic|prizren|peje|gjakov|ferizaj|gjilan|vetevendosje|ldk|pdk|aak|kuvend|abdixhiku|haradinaj|hamza|luginen|presheve|shkup|tetov)/,2],
    [/\b(qeveri|ministr|polici|gjykat|prokurori|komun)/,1]
  ]
};
function catFromKeywords(text){
  const t=norm(text);
  const score={};
  // çdo fjalë e ndryshme që gjendet shton pikë
  for(const c in KW) score[c]=KW[c].reduce((s,[rx,w])=>s+new Set(t.match(new RegExp(rx.source,"g"))||[]).size*w,0);
  // lajmet që përmendin Kosovën/Shqipërinë mbeten "Lajme", edhe me aktorë të huaj
  if(score.national>=2) score.world=0;
  if(score.sport>=4) return "sport";
  const order=["sport","other","culture","national","world"];
  let best="national",bestScore=1;
  for(const c of order) if(score[c]>bestScore){best=c;bestScore=score[c];}
  return best;
}
function classifyItem({title,url,summary,rssCats,hint,only}){
  if(hint && only) return {cat:hint,conf:4}; // sajte vetëm për një temë (FSHF, FFK, TopSporti)
  const r=catFromLabels(rssCats||[]);
  if(hint){
    const labs=(rssCats||[]).map(norm);
    if(!labs.length || labs.some(l=>LABEL_RX[hint]&&LABEL_RX[hint].test(l))) return {cat:hint,conf:4};
    if(r && r!=='national') return {cat:r,conf:3}; // p.sh. showbiz/lifestyle në feed-in e sportit
    return {cat:hint,conf:4};
  }
  if(r) return {cat:r,conf:3};
  const u=catFromUrl(url); if(u) return {cat:u,conf:2};
  const text=norm((title||'')+' '+(summary||''));
  if(/\b(shendet|mjekesi|semundj|diabet|vaksin|kancer|spital|terapi|infarkt|ushqyerj|vitamin)/.test(text))return {cat:'health',conf:1};
  return {cat:catFromKeywords(text),conf:1};
}

  const pool=category==="all"?news:news.filter(n=>n.cat===category);
  return [...new Set(pool.map(n=>n.source))];

const TR_KEY="newsTranslationsEnV1";
let trCache={};
try{trCache=JSON.parse(localStorage.getItem(TR_KEY)||"{}")||{};}catch{trCache={};}
const trQueue=new Map(); let trTimer=null, trBusy=false, trPausedUntil=0, trSaveTimer=null;
function baseTitle(n){return (n.title||"").replace(/\s+—\s+.*$/,"");}
function dispTitle(n){
  const b=baseTitle(n);
  if(lang!=="en") return b;
  const c=trCache[n.url]; if(c&&c.t) return c.t;
  queueTr(n); return b;
}
function cutWords(s,max=170){
  s=String(s||"").trim();
  if(s.length<max) return s;
  const cut=s.slice(0,max); const sp=cut.lastIndexOf(" ");
  return (sp>80?cut.slice(0,sp):cut).replace(/[,;:\-–—\s]+$/,"")+"…";
}
function dispSummary(n){
  const b=cutWords(n.summary||"");
  if(lang!=="en") return b;
  const c=trCache[n.url]; if(c&&c.t) return cutWords(c.s||"");
  queueTr(n); return b;
}
function queueTr(n){
  if(!n||!n.url||trCache[n.url]||trQueue.has(n.url)) return;
  trQueue.set(n.url,n);
  if(!trTimer) trTimer=setTimeout(flushTr,80);
}
function saveTr(){
  clearTimeout(trSaveTimer);
  trSaveTimer=setTimeout(()=>{
    try{
      const keys=Object.keys(trCache);
      if(keys.length>800) keys.slice(0,keys.length-800).forEach(k=>delete trCache[k]);
      localStorage.setItem(TR_KEY,JSON.stringify(trCache));
    }catch{}
  },500);
}
async function googleTranslate(text){
  const res=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=sq&tl=en&dt=t",{
    method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
    body:"q="+encodeURIComponent(text)
  });
  if(!res.ok) throw new Error("translate "+res.status);
  const data=await res.json();
  return (data[0]||[]).map(seg=>seg&&seg[0]||"").join("");
}
async function myMemoryTranslate(text){
  const res=await fetch("https://api.mymemory.translated.net/get?langpair=sq|en&q="+encodeURIComponent(text.slice(0,480)));
  const data=await res.json();
  const out=data?.responseData?.translatedText;
  if(!out||/MYMEMORY WARNING|QUERY LENGTH/i.test(out)) throw new Error("mymemory");
  return out;
}
// Përkthen një listë tekstesh; kthen listë me të njëjtën gjatësi
async function translateList(texts){
  const clean=texts.map(x=>String(x||"").replace(/\s+/g," ").trim());
  const out=new Array(clean.length).fill("");
  let batch=[],len=0;
  const run=async idx=>{
    const joined=idx.map(i=>clean[i]).join("\n");
    let lines=[];
    try{ lines=(await googleTranslate(joined)).split("\n"); }catch{ lines=[]; }
    if(lines.length===idx.length){ idx.forEach((i,k)=>out[i]=lines[k].trim()); return; }
    // ndarja nuk përputhet ose Google dështoi: përkthe një nga një
    for(const i of idx){
      if(!clean[i]) continue;
      try{ out[i]=(await googleTranslate(clean[i])).trim(); }
      catch{ try{ out[i]=(await myMemoryTranslate(clean[i])).trim(); }catch{ out[i]=""; } }
    }
  };
  for(let i=0;i<clean.length;i++){
    if(len+clean[i].length>3500 && batch.length){ await run(batch); batch=[];len=0; }
    batch.push(i); len+=clean[i].length+1;
  }
  if(batch.length) await run(batch);
  return out;
}
async function flushTr(){
  trTimer=null;
  if(trBusy||lang!=="en"||!trQueue.size) return;
  if(Date.now()<trPausedUntil){ trTimer=setTimeout(flushTr,trPausedUntil-Date.now()); return; }
  trBusy=true;
  const items=[...trQueue.values()].slice(0,20);
  items.forEach(n=>trQueue.delete(n.url));
  const texts=[]; items.forEach(n=>{texts.push(baseTitle(n)); texts.push((n.summary||"").slice(0,300));});
  let done=0;
  try{
    const out=await translateList(texts);
    items.forEach((n,i)=>{ const tt=out[i*2]; if(tt){ trCache[n.url]={t:tt,s:out[i*2+1]||""}; done++; } });
  }catch{}
  trBusy=false;
  if(done){ saveTr(); if(lang==="en"){ render(); renderSaved(); } }
  else trPausedUntil=Date.now()+60000; // shërbimi s'po përgjigjet: prit 1 minutë
  if(trQueue.size) trTimer=setTimeout(flushTr,done?150:60000);
}
const bodyTr=new Map();
async function translateReader(n,parts){
  const box=$("articleBody"); if(!box) return;
  const cached=bodyTr.get(n.url);
  const show=list=>{ if($("articleDialog").open && box.isConnected) box.innerHTML=list.map(p=>"<p>"+esc(p)+"</p>").join(""); };
  if(cached){ show(cached); return; }
  box.insertAdjacentHTML("afterbegin",'<p class="translating" id="trNote">'+t("translating")+'</p>');
  const texts=parts.slice(0,40);
  const out=await translateList(texts);
  const list=out.map((p,i)=>p||texts[i]);
  bodyTr.set(n.url,list);
  show(list);
  const h=document.querySelector("#reader h2");
  if(h && !trCache[n.url]){ const [tt]=await translateList([baseTitle(n)]); if(tt){ h.textContent=tt; trCache[n.url]={t:tt,s:""}; saveTr(); } }
}

function interleaveByCategory(items){
  const groups={};
  items.forEach(n=>{
    const k=n.cat||"national";
    (groups[k]||(groups[k]=[])).push(n);
  });
  const keys=Object.keys(groups);
  const out=[];
  let i=0, added=true;
  while(added){
    added=false;
    for(const k of keys){
      if(groups[k][i]){out.push(groups[k][i]);added=true;}
    }
    i++;
  }
  return out;
}

const LEAD_MIX=[['national',3],['sport',3],['world',2],['culture',1]];
function leadSlides(items,isHome){

  const buckets=LEAD_MIX.map(([cat,n])=>pick(cat,n));

function trendScore(n, pool){
  const h=hoursAgo(n);
  let s=Math.max(0,36-h)*3;
  if(h<1) s+=28;
  else if(h<3) s+=18;
  else if(h<8) s+=10;
  const title=(n.title||"").toLowerCase();
  if(/vritet|shpërthen|arresto|protest|luft|godit|aksident|ekskluzive|breaking|live|kriz|masakër|tërrmet|hagë|speciale/.test(title)) s+=16;
  const key=topicKey(n.title);
  if(key){
    const echoes=pool.filter(o=>o!==n && topicKey(o.title)===key).length;
    s+=echoes*12;
  }
  return s;
}

function parseDate(v){
  let s=String(v||"").trim();

  if(/^\d{4}-\d\d-\d\d \d\d:\d\d(:\d\d)?$/.test(s)) s=s.replace(" ","T")+"Z";
  let t=Date.parse(s);
  if(isNaN(t)) return "";
  if(t>Date.now()+5*60000) t=Date.now();
  return new Date(t).toISOString();
}

// Lexohet RSS përmes shërbimit JSON, me provë direkte të XML kur ai dështon.
function xmlToItems(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.querySelector("parsererror")) return [];
  const nodes=[...doc.querySelectorAll("item, entry")];
  return nodes.map(el=>{
    const t=s=>{const n=el.querySelector(s);return n?n.textContent.trim():"";};
    const tag=name=>{const n=el.getElementsByTagName(name)[0];return n?n.textContent.trim():"";};
    let link=t("link");
    if(!link){const a=el.querySelector("link[href]");if(a)link=a.getAttribute("href")||"";}
    if(!link) link=t("guid");
    const media=el.querySelector("enclosure[url], media\\:content, content[url], thumbnail[url]");
    return {
      title:t("title"),
      link,
      pubDate:t("pubDate")||t("published")||t("updated")||tag("dc:date"),
      description:t("description")||t("summary"),
      content:tag("content:encoded")||t("content")||t("description"),
      categories:[...el.querySelectorAll("category")].map(c=>c.getAttribute("term")||c.textContent.trim()).filter(Boolean),
      thumbnail:media?(media.getAttribute("url")||""):""
    };
  }).filter(i=>i.title&&i.link);
}
async function grab(url,ms=15000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),ms);
  try{
    const res=await fetch(url,{signal:controller.signal,mode:"cors"});
    if(!res.ok) return null;
    return await res.text();
  }catch{return null;}
  finally{clearTimeout(timer);}
}
const pendingFeeds=new Map();
async function fetchJsonRss(feed){
 if(pendingFeeds.has(feed))return pendingFeeds.get(feed);
 const work=(async()=>{
   // Keep the publisher URL stable: changing it creates a new conversion job.
   const endpoint='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed);
   // rss2json falas mund ta mbajë feed-in në cache deri në 1 orë; prandaj marrim paralelisht
   // edhe kopjen e freskët përmes proxy-t (parametri "lm" ndryshon çdo minutë) dhe i bashkojmë.
   const fresh=feed+(feed.includes("?")?"&":"?")+"lm="+Math.floor(Date.now()/60000);
   const [a,b]=await Promise.all([
     grab(endpoint,20000).then(t=>{try{const d=JSON.parse(t);return d?.status==='ok'&&Array.isArray(d.items)?d.items:[];}catch{return [];}}),
     grab('https://api.allorigins.win/raw?url='+encodeURIComponent(fresh),15000).then(t=>t?xmlToItems(t):[]).catch(()=>[])
   ]);
   if(a.length||b.length){
     const seen=new Set(), merged=[];
     for(const it of [...b,...a]){ const k=it.link||it.guid||it.title; if(k&&!seen.has(k)){seen.add(k);merged.push(it);} }
     return merged;
   }
   for(let attempt=0;attempt<2;attempt++){
     const text=await grab(endpoint,20000);
     try{const data=JSON.parse(text);if(data?.status==='ok'&&Array.isArray(data.items)&&data.items.length)return data.items;}catch{}
     if(attempt===0){
       const xml=await grab(feed,10000);
       if(xml){const items=xmlToItems(xml);if(items.length)return items;}
     }
   }
   const xmlTries=[
     'https://api.allorigins.win/raw?url='+encodeURIComponent(feed),
     'https://corsproxy.io/?'+encodeURIComponent(feed)
   ];
   for(const u of xmlTries){
     const xml=await grab(u,15000);
     const items=xml?xmlToItems(xml.includes('<rss')||xml.includes('<feed')?xml:(()=>{try{const j=JSON.parse(xml);return j.contents||'';}catch{return xml;}})()):[];
     if(items.length) return items;
   }
   return [];
 })();
 pendingFeeds.set(feed,work);try{return await work;}finally{pendingFeeds.delete(feed);}
}
async function publicPage(url){
 const tries=[
   url,
   'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
   'https://api.allorigins.win/get?url='+encodeURIComponent(url),
   'https://corsproxy.io/?'+encodeURIComponent(url)
 ];
 for(const endpoint of tries){
   const html=await grab(endpoint,15000);
   if(!html) continue;
   let body=html;
   if(html.trim()[0]==='{'){
     try{const j=JSON.parse(html); if(j&&typeof j.contents==='string') body=j.contents;}catch{}
   }
   if(body && /<html[\s>]/i.test(body) && !/cf-chl-|Just a moment|Access denied/i.test(body.slice(0,6000))) return body;
 }
 return '';
}
function websiteArticle(feed,url,html){
 const doc=new DOMParser().parseFromString(html,'text/html');
 const meta=k=>doc.querySelector('meta[property="'+k+'"],meta[name="'+k+'"]')?.getAttribute('content')||'';
 const schemas=[];
 function visit(v){if(!v||typeof v!=='object')return;if(Array.isArray(v)){v.forEach(visit);return;}if(/Article|NewsArticle|BlogPosting/.test(String(v['@type'])))schemas.push(v);if(v['@graph'])visit(v['@graph']);}
 doc.querySelectorAll('script[type="application/ld+json"]').forEach(el=>{try{visit(JSON.parse(el.textContent));}catch{}});
 const schema=schemas[0]||{};
 const title=String(schema.headline||meta('og:title')||doc.querySelector('h1')?.textContent||'').trim();
 if(!title)return null;
 const description=meta('og:description')||schema.description||'';
 let text=schema.articleBody||'';
 if(!text){
   const body=doc.querySelector('[itemprop="articleBody"],.article-content,.article-body,.article-text,.entry-content,.post-content,article');
   if(body){body.querySelectorAll('script,style,nav,aside,footer,.related,.share,.ads').forEach(x=>x.remove());text=[...body.querySelectorAll('p')].map(x=>x.textContent.trim()).filter(x=>x.length>35).join('\n\n');}
 }
 const previewOnly=!text;text=text||description;if(!text)return null;
 const published=parseDate(schema.datePublished||meta('article:published_time')||doc.querySelector('time[datetime]')?.getAttribute('datetime'));
 const summary=strip(description||text).slice(0,180);
 const {cat,conf}=classifyItem({title,url,summary,rssCats:[schema.articleSection||''],hint:feed.hint,only:feed.only});
 const author=typeof schema.author==='string'?schema.author:schema.author?.name||meta('author')||feed.src;
 return {id:stableId(url),source:feed.src,title,url,cat,catConf:conf,summary,content:text,body:text,image:meta('og:image'),author,publishedAt:published,previewOnly};
}
async function fetchWebsite(feed){
 const html=await publicPage(feed.url);if(!html)throw new Error('Portali nuk u përgjigj');
 const doc=new DOMParser().parseFromString(html,'text/html');const home=new URL(feed.url);
 const urls=[...new Set([...doc.querySelectorAll('a[href]')].map(a=>{
   try{const u=new URL(a.getAttribute('href'),home);if(u.hostname.replace(/^www\./,'')!==home.hostname.replace(/^www\./,''))return null;
     const path=(u.pathname||'/').replace(/\/+$/,'');
     const parts=path.split('/').filter(Boolean);
     const looksArticle=parts.length>=2 || (parts.length===1 && parts[0].length>20 && /[-_]/.test(parts[0]));
     if(!looksArticle||/\.(jpg|jpeg|png|pdf|webp)|\/page\/|\/author\/|\/tag\/|\/category\//i.test(path))return null;
     u.hash='';u.search='';return safeURL(u.href);
   }catch{return null;}
 }).filter(Boolean))].slice(0,10);
 const items=[];let cursor=0;
 await Promise.all(Array.from({length:3},async()=>{while(cursor<urls.length){const url=urls[cursor++];const page=await publicPage(url);if(page){const n=websiteArticle(feed,url,page);if(n)items.push(n);}}}));

}
// WordPress REST API: lajme të freskëta (pa cache të rss2json) dhe me foto kryesore.
// Përdoret për burimet me wp:true; nëse s'punon, kalohet te RSS.
async function fetchWpJson(feed){
 const origin=new URL(feed.url).origin;
 const api=origin+'/wp-json/wp/v2/posts?per_page=20&_embed=1';
 for(const endpoint of [api,'https://api.allorigins.win/raw?url='+encodeURIComponent(api)]){
   const text=await grab(endpoint,15000);
   if(!text) continue;
   let posts; try{posts=JSON.parse(text);}catch{continue;}
   if(!Array.isArray(posts)||!posts.length) continue;
   return posts.flatMap(p=>{
     const url=safeURL(p.link); const title=strip(p.title?.rendered||'');
     if(!url||!title) return [];
     const content=p.content?.rendered||''; const body=strip(content);
     const summary=strip(p.excerpt?.rendered||content).slice(0,180);
     const terms=(p._embedded?.['wp:term']||[]).flat().filter(x=>x&&x.name).map(x=>x.name);
     const media=(p._embedded?.['wp:featuredmedia']||[])[0]||{};
     const sizes=media.media_details?.sizes||{};
     const image=(sizes.medium_large||sizes.large||sizes.full||{}).source_url||media.source_url||'';
     const {cat,conf}=classifyItem({title,url,summary,rssCats:terms,hint:feed.hint,only:feed.only});
     return [{id:stableId(url),source:feed.src,title,url,cat,catConf:conf,rssCats:terms,summary,content,body,
       image:/^https?:\/\//.test(image)?image.replace(/^http:/,'https:'):'',author:feed.src,
       publishedAt:parseDate(p.date_gmt?p.date_gmt+'Z':p.date),previewOnly:body.length<400}];
   });
 }
 return [];
}
async function fetchArticles(feed){

 if(feed.wp && !/[?&]paged=/.test(feed.url)){ try{items=await fetchWpJson(feed);}catch{items=[];} }
 if(!items.length && feed.kind!=='website'){
   try{ items=mapRssItems(feed,await fetchJsonRss(feed.url)); }catch{items=[];}
 }
 if(!items.length){
   const home=feed.url.replace(/\/feed\/?$/,'/');
   try{ items=await fetchWebsite({...feed,url:home,kind:'website'}); }catch{items=[];}
 }
 return items.filter(n=>n&&n.title&&n.url).map(ensurePicture);
}
function readableContent(content, description){
  if(!content) return false;
  const text=strip(content);
  // Reject short excerpts and explicit "continue reading" truncation markers.
  return text.length >= 500 && text.split(/\s+/).length >= 80
    && !/(\[\s*…\s*\]|\[\s*\.\.\.\s*\]|class=["'][^"']*more-link|continue reading|lexo më shumë)/i.test(content);
}

// Bashkon lajmet e reja me ato ekzistuese; kthen numrin e lajmeve të reja
function mergeNews(incoming,{prune=true}={}){
  const map=new Map(news.map(n=>[n.url,n]));
  let fresh=0;
  for(const n of incoming){
    const old=map.get(n.url);
    if(!old){
      map.set(n.url,{...n,newAt:initialDone?Date.now():0});
      fresh++;
      continue;
    }
    // kategoria me burim më të sigurt fiton (p.sh. feed-i /sport/ mbi fjalët kyçe)
    const keepOld=(old.catConf||0)>(n.catConf||0);
    map.set(n.url,{...old,...n,cat:keepOld?old.cat:n.cat,catConf:Math.max(old.catConf||0,n.catConf||0),newAt:old.newAt});
  }
  let list=[...map.values()].sort((a,b)=>(Date.parse(b.publishedAt)||0)-(Date.parse(a.publishedAt)||0));
  if(prune){
    const cutoff=Date.now()-MAX_AGE_MS, count={};
    list=list.filter(n=>{
      if(saved.has(n.id)) return true;
      if(n.publishedAt && (Date.parse(n.publishedAt)||0)<cutoff) return false;
      count[n.cat]=(count[n.cat]||0)+1;
      return count[n.cat]<=MAX_PER_CAT;
    });
  }
  news=list;
  saveCache();
  return fresh;
}

async function refreshAll(opts={}){
  const silent=!!opts.silent;
  if(refreshing) return;
  // kur aplikacioni është në sfond nuk harxhojmë kërkesa; rifreskohet kur rikthehesh
  if(silent && document.hidden){ scheduleNext(); return; }
  refreshing=true; refreshStarted=Date.now(); updateRefreshInfo();
  if(!silent && !news.length){ loading=true; render(); }
  $("loadStatus").textContent=silent?t("stChecking"):t("stLoading");
  let fresh=0, ok=false, okFeeds=0;
  const before=new Set(news.map(n=>n.url));
  try{
    const incoming=[];let cursor=0;
    const names=[...new Set(FEEDS.map(f=>f.src))];
    names.forEach(name=>sourceStatus[name]={state:'loading',count:0});renderSourceList();
    await Promise.all(Array.from({length:5},async()=>{
      while(cursor<FEEDS.length){
        const f=FEEDS[cursor++];
        try{
          const batch=await fetchArticles(f);
          if(batch.length){okFeeds++;incoming.push(...batch);sourceStatus[f.src]={state:'ok',count:(sourceStatus[f.src]?.count||0)+batch.length};mergeNews(batch);chips();render();}
          else if(sourceStatus[f.src]?.state!=='ok')sourceStatus[f.src]={state:'empty',count:0};
        }catch{if(sourceStatus[f.src]?.state!=='ok')sourceStatus[f.src]={state:'error',count:0};}
        renderSourceList();
      }
    }));
    const got=new Set(incoming.map(n=>n.source));
    for(const name of [...new Set(FEEDS.map(f=>f.src))]){
      if(got.has(name) || incoming.some(n=>n.source===name)) continue;
      const home=FEEDS.find(f=>f.src===name && (f.kind==='website' || /\/$/.test(f.url) || !f.url.includes('/feed')));
      const url=home?home.url:(FEEDS.find(f=>f.src===name)||{}).url;
      if(!url) continue;
      try{
        const extra=await fetchWebsite({src:name,url:url.replace(/\/feed\/?$/,'/'),kind:'website'});
        if(extra&&extra.length){ incoming.push(...extra.map(ensurePicture)); got.add(name); sourceStatus[name]={state:'ok',count:extra.length}; }
      }catch{}
    }
    ok=incoming.length>0;
    if(ok){fresh=new Set(incoming.filter(n=>!before.has(n.url)).map(n=>n.url)).size;mergeNews(incoming.map(ensurePicture));lastSuccess=Date.now();}
  }finally{
    refreshing=false; loading=false; initialDone=true;
    lastRefresh=Date.now(); scheduleNext();
  }
  const where=category==="all"?"":" ("+labels[category]+")";
  $("loadStatus").textContent=ok
    ? (fresh?t("stFound",{n:fresh,f:okFeeds}):t("stNone",{w:where}))
    : t("stFail");
  if(sourceFilter!=="all" && !activeSources().includes(sourceFilter)) sourceFilter="all";
  const unavailable=Object.entries(sourceStatus).filter(([n,v])=>v.state!=='ok').map(([n])=>n);
  if(unavailable.length)$("loadStatus").textContent+=t("stMissing",{s:unavailable.join(", ")});
  chips();render();renderSaved();renderSourceList();updateRefreshInfo();
  if(!sharedOpened) openSharedArticle(true);
}

}

async function jsonFrom(urls){
  for(const u of urls){
    const txt=await grab(u,14000);
    if(!txt || txt[0]==='<') continue;
    try{
      const data=JSON.parse(txt);
      if(data && typeof data.contents==='string'){
        try{ return JSON.parse(data.contents); }catch{ continue; }
      }
      if(data && data.error) continue;
      return data;
    }catch{}
  }
  return null;
}
function sofa(path){
  const a='https://api.sofascore.com/api/v1/'+path, b='https://www.sofascore.com/api/v1/'+path;
  return jsonFrom([
    'https://api.allorigins.win/get?url='+encodeURIComponent(a),
    'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(a),
    'https://corsproxy.io/?'+encodeURIComponent(a),
    a,b
  ]);
}
function sofaEvent(e){
  if(!e) return null;
  return {home:e.homeTeam?.name||'',away:e.awayTeam?.name||'',homeId:e.homeTeam?.id,awayId:e.awayTeam?.id,
    hs:e.homeScore?.current??e.homeScore?.display??null, as:e.awayScore?.current??e.awayScore?.display??null,
    ts:(e.startTimestamp||0)*1000, comp:e.tournament?.uniqueTournament?.name||e.tournament?.name||'',
    state:e.status?.type||'', ut:e.tournament?.uniqueTournament?.id, season:e.season?.id,
    id:e.id, code:e.status?.code, desc:e.status?.description||'', periodStart:(e.time?.currentPeriodStartTimestamp||0)*1000,
    hasTable:!!(e.tournament?.uniqueTournament?.hasStandingsGroups||e.tournament?.uniqueTournament?.hasGroups||e.tournament?.isGroup)};
}
async function loadTeamSofa(t){
  const [info,last,next,rk]=await Promise.all([sofa('team/'+t.sofa),sofa('team/'+t.sofa+'/events/last/0'),sofa('team/'+t.sofa+'/events/next/0'),sofa('team/'+t.sofa+'/rankings')]);
  if(!last && !next && !info) return null;
  const lastEvs=(last?.events||[]).filter(e=>e.status?.type==='finished').sort((a,b)=>b.startTimestamp-a.startTimestamp);
  const nextEvs=(next?.events||[]).sort((a,b)=>a.startTimestamp-b.startTimestamp);
  const live=[...(last?.events||[]),...(next?.events||[])].find(e=>e.status?.type==='inprogress');
  const out={src:'SofaScore',coach:info?.team?.manager?.name||'',
    rank:(rk?.rankings||[]).find(r=>/fifa/i.test(JSON.stringify(r.rankingClass||r.type||r.name||'')))?.ranking||(rk?.rankings||[])[0]?.ranking||info?.team?.ranking||null,
    last:sofaEvent(lastEvs[0]), next:sofaEvent(live||nextEvs[0]), table:null,
    past:lastEvs.slice(0,8).map(sofaEvent), upcoming:(live?[live,...nextEvs.filter(e=>e!==live)]:nextEvs).slice(0,8).map(sofaEvent)};
  // tabela: turneu i ndeshjes së radhës (ose të fundit) që ka grupe
  const cands=[...nextEvs,...lastEvs].map(sofaEvent).filter(e=>e&&e.ut&&e.season&&!/friendly|miqësor/i.test(e.comp));
  const seen=new Set();
  for(const ev of cands){
    const k=ev.ut+'/'+ev.season; if(seen.has(k)) continue; seen.add(k); if(seen.size>2) break;
    const st=await sofa('unique-tournament/'+ev.ut+'/season/'+ev.season+'/standings/total');
    const group=(st?.standings||[]).find(g=>(g.rows||[]).some(r=>r.team?.id===t.sofa));
    if(group){
      out.table={name:(group.name||ev.comp),comp:ev.comp,rows:group.rows.map(r=>({pos:r.position,name:r.team?.name||'',id:r.team?.id,p:r.matches,gd:(r.scoresFor??0)-(r.scoresAgainst??0),pts:r.points,me:r.team?.id===t.sofa}))};
      break;
    }
  }
  return out;
}
async function loadTeamEspn(t){
  const base='https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.nations';
  const list=await jsonFrom([base+'/teams']);
  const team=(list?.sports?.[0]?.leagues?.[0]?.teams||[]).map(x=>x.team).find(x=>t.espn.test(x.displayName||''));
  if(!team) return null;
  const [past,fut,st]=await Promise.all([jsonFrom([base+'/teams/'+team.id+'/schedule']),jsonFrom([base+'/teams/'+team.id+'/schedule?fixture=true']),jsonFrom(['https://site.api.espn.com/apis/v2/sports/soccer/uefa.nations/standings'])]);
  const ev=e=>{ if(!e) return null; const c=e.competitions?.[0]||{}; const h=(c.competitors||[]).find(x=>x.homeAway==='home')||{}, a=(c.competitors||[]).find(x=>x.homeAway==='away')||{};
    const sc=x=>{const v=x.score; if(v==null) return null; const n=Number(typeof v==='object'?(v.displayValue??v.value):v); return isNaN(n)?null:n;};
    return {home:h.team?.displayName||'',away:a.team?.displayName||'',hs:sc(h),as:sc(a),ts:Date.parse(e.date)||0,comp:'UEFA Nations League',state:c.status?.type?.completed?'finished':(c.status?.type?.state==='in'?'inprogress':'notstarted')}; };
  const pastEvs=(past?.events||[]).map(ev).filter(e=>e&&e.state==='finished').sort((a,b)=>b.ts-a.ts);
  const futEvs=(fut?.events||past?.events||[]).map(ev).filter(e=>e&&e.state!=='finished').sort((a,b)=>a.ts-b.ts);
  let table=null;
  const groups=[...(st?.children||[])]; groups.forEach(g=>(g.children||[]).forEach(c=>groups.push(c)));
  const g=groups.find(g=>(g.standings?.entries||[]).some(e=>String(e.team?.id)===String(team.id)));
  if(g){ const stat=(e,n)=>(e.stats||[]).find(s=>s.name===n)?.value;
    table={name:g.name||g.abbreviation||'',comp:'UEFA Nations League',rows:g.standings.entries.map((e,i)=>({pos:stat(e,'rank')||i+1,name:e.team?.displayName||'',p:stat(e,'gamesPlayed'),gd:stat(e,'pointDifferential'),pts:stat(e,'points'),me:String(e.team?.id)===String(team.id)})).sort((a,b)=>a.pos-b.pos)}; }
  if(!pastEvs.length && !futEvs.length && !table) return null;
  return {src:'ESPN',coach:'',rank:null,last:pastEvs[0]||null,next:futEvs[0]||null,table,past:pastEvs.slice(0,8),upcoming:futEvs.slice(0,8)};
}

// rifreskim i shpejtë: vetëm ndeshja live (event/{id}), pa ringarkuar gjithçka
async function refreshLive(){
  let ended=false;
  for(const tm of NATIONAL_TEAMS){
    const d=teamsData[tm.key]; if(!d||d.src!=='SofaScore') continue;
    const m=(d.upcoming||[]).find(x=>x&&x.id&&(x.state==='inprogress'||(x.state!=='finished'&&Date.now()>=x.ts-5*60000)));
    if(!m) continue;
    const r=await sofa('event/'+m.id);
    if(!r?.event) continue;
    const fresh=sofaEvent(r.event);
    Object.assign(m,fresh);
    if(fresh.state==='finished') ended=true;
  }
  if(ended) teamsChecked=0, await refreshTeams(true); // ndeshja mbaroi: tabela dhe forma përditësohen
  else if(category==='sport') renderTeams();
}
function liveMinute(m){
  if(m.code===31) return 'HT';
  if(!m.periodStart) return m.desc||'LIVE';
  const base=m.code===7?45:m.code===41?90:m.code===42?105:0;
  const cap=m.code===6?45:m.code===7?90:m.code===41?105:120;
  const min=base+Math.floor((Date.now()-m.periodStart)/60000)+1;
  return min>cap?cap+"+'":min+"'";
}
async function loadTeamTSDB(tm){
  const id=tm.key==='alb'?'135981':'136518';
  const [last,next]=await Promise.all([
    jsonFrom(['https://www.thesportsdb.com/api/v1/json/3/eventslast.php?id='+id]),
    jsonFrom(['https://www.thesportsdb.com/api/v1/json/3/eventsnext.php?id='+id])
  ]);
  const map=e=>{
    if(!e||!e.strHomeTeam) return null;
    const ts=Date.parse(e.strTimestamp||'')||Date.parse((e.dateEvent||'')+'T'+(e.strTime||'00:00:00')+'Z')||0;
    const hs=e.intHomeScore==null||e.intHomeScore===''?null:Number(e.intHomeScore);
    const as=e.intAwayScore==null||e.intAwayScore===''?null:Number(e.intAwayScore);
    return {home:e.strHomeTeam,away:e.strAwayTeam,homeId:null,awayId:null,hs,as,ts,comp:e.strLeague||'',state:hs!=null?'finished':'notstarted',id:e.idEvent,code:'',desc:'',periodStart:0};
  };
  const past=(last&&last.results||[]).map(map).filter(Boolean);
  const upcoming=(next&&next.events||[]).map(map).filter(Boolean);
  if(!past.length && !upcoming.length) return null;
  return {src:'TheSportsDB',coach:'',rank:null,last:past[0]||null,next:upcoming[0]||null,table:null,past,upcoming};
}
async function refreshTeams(force){
  if(teamsBusy || document.hidden) return;
  if(!force && Date.now()-teamsChecked<10*60*1000){ scheduleLive(); return; }
  teamsBusy=true; teamsChecked=Date.now();
  try{
    for(const t of NATIONAL_TEAMS){
      let d=null;
      try{ d=await loadTeamSofa(t); }catch{}
      if(!d || (!d.last && !d.next)){ try{ const e=await loadTeamEspn(t); if(e) d={...e,coach:d?.coach||'',rank:d?.rank||null}; }catch{} }
      if(!d || (!d.last && !d.next)){ try{ const s=await loadTeamTSDB(t); if(s) d=d?{...s,...d,last:d.last||s.last,next:d.next||s.next,past:d.past||s.past,upcoming:d.upcoming||s.upcoming,src:d.src||s.src}:s; }catch{} }
      if(d){ d.at=Date.now(); teamsData[t.key]=d; }
      if(category==='sport') renderTeams();
    }
    try{localStorage.setItem(TEAMS_CACHE_KEY,JSON.stringify(teamsData));}catch{}
  }finally{ teamsBusy=false; }
  if(category==='sport') renderTeams();
  scheduleLive();
}

// Ndeshjet: 0 = e radhës; › më tej në të ardhmen, ‹ te ndeshjet e kaluara
const teamMatchIdx={};
function matchLists(d){
  const past=(d.past&&d.past.length?d.past:(d.last?[d.last]:[])).filter(Boolean);
  const up=(d.upcoming&&d.upcoming.length?d.upcoming:(d.next?[d.next]:[])).filter(Boolean);
  return {past,up};
}
function matchNav(key,d){
  const {past,up}=matchLists(d);
  let i=teamMatchIdx[key]??(up.length?0:-1);
  i=Math.max(-past.length,Math.min(up.length-1,i));
  if(!up.length && i>=0) i=past.length?-1:0;
  teamMatchIdx[key]=i;
  const m=i>=0?up[i]:past[-i-1];
  const title=(i>=0&&m&&m.state==='inprogress')?t('tmLiveNow'):i>=0?(i===0?t('tmNext'):t('tmLater')+' '+(i+1)+'/'+up.length):(i===-1?t('tmPrev'):t('tmEarlier')+' '+(-i)+'/'+past.length);
  const canPrev=i>-past.length, canNext=i<up.length-1;
  return `<div class="tm-nav">
    <button type="button" class="tm-arrow" data-tm-go="${key}" data-dir="-1" ${canPrev?'':'disabled'} aria-label="${t('tmPrevAria')}">‹</button>
    ${matchBox(title,m,i>=0)}
    <button type="button" class="tm-arrow" data-tm-go="${key}" data-dir="1" ${canNext?'':'disabled'} aria-label="${t('tmNextAria')}">›</button>
  </div>`;
}
// Forma: 5 ndeshjet e fundit (e vjetra majtas, e fundit djathtas)
function formCard(tm,d){
  const {past}=matchLists(d);
  const res=past.slice(0,5).map(m=>{
    const home=m.homeId?m.homeId===tm.sofa:new RegExp(tm.en,'i').test(m.home);
    const gf=home?m.hs:m.as, ga=home?m.as:m.hs;
    if(gf==null||ga==null) return null;
    const r=gf>ga?'W':gf<ga?'L':'D';
    return {r,opp:teamName(home?m.away:m.home),oppRaw:home?m.away:m.home,oppId:home?m.awayId:m.homeId,score:gf+'–'+ga,ts:m.ts};
  }).filter(Boolean).reverse();
  if(!res.length) return `<div class="tm-form"><h5>${t('tmForm')}</h5><p class="tm-empty">—</p></div>`;
  const L={W:t('tmW'),D:t('tmD'),L:t('tmL')};
  const cnt=k=>res.filter(x=>x.r===k).length;

];
const ZONE_SQ=[[/champions league/i,'Kualifikimet e Ligës së Kampionëve'],[/europa league/i,'Kualifikimet e Ligës së Evropës'],[/conference league/i,'Kualifikimet e Ligës së Konferencës'],[/championship round|championship group|title/i,'Grupi i kampionatit'],[/relegation round|relegation group/i,'Grupi i rënies'],[/promotion play-?offs?/i,'Play-off për ngritje'],[/relegation play-?offs?/i,'Play-off për mbijetesë'],[/promotion/i,'Ngritje'],[/relegation/i,'Rënie'],[/play-?offs?/i,'Play-off']];
function zoneLabel(txt){ if(!txt) return ''; if(lang==='en') return txt; const z=ZONE_SQ.find(([rx])=>rx.test(txt)); return z?z[1]:txt; }
function zoneColor(txt){
  const s=String(txt||'').toLowerCase();
  if(!s) return '';
  if(/relegation play/.test(s)) return '#e38b3c';
  if(/relegation/.test(s)) return '#d8453f';
  if(/play-?off/.test(s)) return '#e3a13c';
  if(/champions league|promotion|championship|title/.test(s)) return '#2e9e5b';
  if(/europa/.test(s)) return '#3d7fd1';
  if(/conference/.test(s)) return '#2fa3a0';
  return '#8a8f8a';
}
const LEAGUES_CACHE_KEY='leaguesDataV1';

function leagueEvent(e){
  return {id:e.id,home:e.homeTeam?.shortName||e.homeTeam?.name||'',away:e.awayTeam?.shortName||e.awayTeam?.name||'',homeId:e.homeTeam?.id,awayId:e.awayTeam?.id,
    hs:e.homeScore?.current??null,as:e.awayScore?.current??null,ts:(e.startTimestamp||0)*1000,state:e.status?.type||'',code:e.status?.code,desc:e.status?.description||'',
    periodStart:(e.time?.currentPeriodStartTimestamp||0)*1000};
}
async function loadLeague(L){
  const seasons=await sofa('unique-tournament/'+L.ut+'/seasons');
  const sid=seasons?.seasons?.[0]?.id; if(!sid) return null;
  const [rounds,st]=await Promise.all([sofa('unique-tournament/'+L.ut+'/season/'+sid+'/rounds'),sofa('unique-tournament/'+L.ut+'/season/'+sid+'/standings/total')]);
  const cur=rounds?.currentRound;
  let events=[];
  if(cur?.round!=null){
    const path='unique-tournament/'+L.ut+'/season/'+sid+'/events/round/'+cur.round+(cur.slug?'/slug/'+cur.slug:'');
    const ev=await sofa(path);
    events=(ev?.events||[]).map(leagueEvent).sort((a,b)=>a.ts-b.ts);
  }
  const groups=(st?.standings||[]).filter(g=>(g.rows||[]).length>1).map(g=>({name:g.name||'',rows:g.rows.map(r=>({pos:r.position,name:r.team?.shortName||r.team?.name||'',id:r.team?.id,p:r.matches,gd:(r.scoresFor??0)-(r.scoresAgainst??0),pts:r.points,zone:r.promotion?.text||''}))}));
  if(!events.length && !groups.length) return null;
  return {sid,round:cur?.round??null,roundName:cur?.name||'',events,groups,at:Date.now()};
}
async function refreshLeague(key,force){
  const L=LEAGUES.find(l=>l.key===key); if(!L||leagueBusy[key]||document.hidden) return;
  if(!force && Date.now()-(leagueChecked[key]||0)<10*60*1000) return;
  leagueBusy[key]=true; leagueChecked[key]=Date.now();
  try{ const d=await loadLeague(L); if(d){ leaguesData[key]=d; try{localStorage.setItem(LEAGUES_CACHE_KEY,JSON.stringify(leaguesData));}catch{} } }
  catch{} finally{ leagueBusy[key]=false; }
  if(category==='sport') renderLeagues();
  scheduleLeagueLive();
}
function leagueHasLive(key){
  const d=leaguesData[key]; if(!d) return false; const now=Date.now();
  return d.events.some(m=>m.state==='inprogress'||(m.state!=='finished'&&m.ts&&now>=m.ts-5*60000&&now<=m.ts+3*3600000));
}
function scheduleLeagueLive(){
  clearTimeout(leagueLiveTimer);
  if(category==='sport' && leagueHasLive(leagueTab)) leagueLiveTimer=setTimeout(async()=>{
    if(category==='sport'&&!document.hidden){
      const d=leaguesData[leagueTab], L=LEAGUES.find(l=>l.key===leagueTab);
      if(d&&d.round!=null){
        const ev=await sofa('unique-tournament/'+L.ut+'/season/'+d.sid+'/events/round/'+d.round);
        if(ev?.events){
          const wasLive=d.events.some(m=>m.state==='inprogress');
          d.events=ev.events.map(leagueEvent).sort((a,b)=>a.ts-b.ts);
          const nowLive=d.events.some(m=>m.state==='inprogress');
          if(wasLive&&!nowLive) leagueChecked[leagueTab]=0, await refreshLeague(leagueTab,true); // mbaroi raundi: përditëso tabelën
          else renderLeagues();
        }
      }
    }
    scheduleLeagueLive();
  },30000);
}

function leagueCard(m){

  const [d,h]=fmtMatchDate(m.ts);
  const top=live?`<b class="tm-live"><i></i>${esc(liveMinute(m))}</b>`:done?`<span>${esc(d)}</span><span>FT</span>`:`<span>${esc(d)}</span><span>${esc(h)}</span>`;

    <div class="lg-row">${logo(m.homeId)}<span>${esc(m.home)}</span>${sc(m.hs)}</div>
    <div class="lg-row">${logo(m.awayId)}<span>${esc(m.away)}</span>${sc(m.as)}</div></div>`;
}
function splitRows(L,rows){
  if(L.split){ const out=[]; let i=0; L.split.forEach((n,k)=>{ out.push({label:(L.splitLabels?.[lang]||[])[k]||'',rows:rows.slice(i,i+n)}); i+=n; }); if(i<rows.length) out[out.length-1].rows.push(...rows.slice(i)); return out; }
  if(L.chunk){ const out=[]; for(let i=0;i<rows.length;i+=L.chunk) out.push({label:'',rows:rows.slice(i,i+L.chunk)}); return out; }
  if(L.zones3){
    const isRel=r=>/relegation/i.test(r.zone);
    const top=rows.filter(r=>r.zone&&!isRel(r)), bottom=rows.filter(isRel), mid=rows.filter(r=>!top.includes(r)&&!bottom.includes(r));
    if(top.length||bottom.length) return [{label:lang==='en'?'Top':'Kreu',rows:top},{label:lang==='en'?'Mid-table':'Mesi i tabelës',rows:mid},{label:lang==='en'?'Bottom':'Fundi',rows:bottom}].filter(x=>x.rows.length);
    const n=Math.ceil(rows.length/3); return [0,1,2].map(k=>({label:'',rows:rows.slice(k*n,(k+1)*n)})).filter(x=>x.rows.length);
  }
  return [{label:'',rows}];
}
function leagueTable(L,g,multi){

    <div class="lg-parts parts-${parts.length}">${parts.map(p=>`<div class="lg-part">${p.label?`<h6>${esc(p.label)}</h6>`:''}
      <table><thead><tr><th>#</th><th>${t('tmTeam')}</th><th>${t('tmP')}</th><th>+/-</th><th>${t('tmPts')}</th></tr></thead>

    ${zones.length?`<div class="lg-legend">${zones.map(z=>`<span><i style="background:${zoneColor(z)}"></i>${esc(zoneLabel(z))}</span>`).join('')}</div>`:''}
  </div>`;
}

const weatherCities=[
 {name:'Prishtinë',lat:42.6629,lon:21.1655},
 {name:'Prizren',lat:42.2139,lon:20.7397},
 {name:'Pejë',lat:42.6591,lon:20.2883},

try{const name=localStorage.getItem('weatherCity');const index=weatherCities.findIndex(c=>c.name===name);if(index>=0)weatherCityIndex=index;}catch{}
let weatherBusy=false,weatherChecked=0,weatherRequest=0;
function showWeatherCity(){ $('weatherCity').textContent=weatherCities[weatherCityIndex].name; }
function changeWeatherCity(direction){
 weatherCityIndex=(weatherCityIndex+direction+weatherCities.length)%weatherCities.length;
 weatherRequest++;weatherBusy=false;weatherChecked=0;
 showWeatherCity();
 try{localStorage.setItem('weatherCity',weatherCities[weatherCityIndex].name);}catch{}
 $('weatherContent').innerHTML='<p class="weather-status">Duke ngarkuar motin…</p>';
 updateWeather();
}
$('weatherPrev').onclick=()=>changeWeatherCity(-1);
$('weatherNext').onclick=()=>changeWeatherCity(1);
showWeatherCity();
function weatherSymbol(code){if(code===0)return '☀';if(code<=2)return '⛅';if(code===3)return '☁';if(code<=48)return '≋';if(code>=95)return '⛈';if((code>=71&&code<=77)||code===85||code===86)return '❄';return '☂';}
function weatherDescription(code){if(code===0)return 'Kthjellët';if(code<=2)return 'Pjesërisht me re';if(code===3)return 'Me re';if(code<=48)return 'Mjegull';if(code>=95)return 'Stuhi';if((code>=71&&code<=77)||code===85||code===86)return 'Borë';return 'Shi';}
async function updateWeather(){
 if(weatherBusy||document.hidden||Date.now()-weatherChecked<15*60*1000)return;
 weatherBusy=true;
 const request=++weatherRequest,city=weatherCities[weatherCityIndex];
 try{
  const raw=await grab('https://api.open-meteo.com/v1/forecast?latitude='+city.lat+'&longitude='+city.lon+'&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FBelgrade&forecast_days=3',15000);
  if(request!==weatherRequest)return;
  const data=JSON.parse(raw);
  if(!Number.isFinite(data?.current?.temperature_2m)||!Array.isArray(data?.daily?.time)||data.daily.time.length<3)throw Error('Invalid forecast');
  const c=data.current,d=data.daily;const temp=x=>Number.isFinite(x)?Math.round(x)+'°':'—';
  $('weatherContent').innerHTML=`<div class="weather-now"><div class="weather-temp"><span aria-hidden="true">${weatherSymbol(c.weather_code)}</span>${temp(c.temperature_2m)}</div></div><p class="weather-desc">${weatherDescription(c.weather_code)} · ${temp(d.temperature_2m_max[0])} / ${temp(d.temperature_2m_min[0])}</p><div class="weather-days">${d.time.slice(0,3).map((day,i)=>`<div><small>${i===0?'Sot':new Intl.DateTimeFormat('sq',{weekday:'short',timeZone:'Europe/Belgrade'}).format(new Date(day+'T12:00:00Z'))}</small><span aria-label="${weatherDescription(d.weather_code[i])}">${weatherSymbol(d.weather_code[i])}</span> ${temp(d.temperature_2m_max[i])}</div>`).join('')}</div>`;
  weatherChecked=Date.now();
 }catch{if(request!==weatherRequest)return;$('weatherContent').innerHTML='<p class="weather-status">Moti nuk është i disponueshëm. Provojmë përsëri së shpejti.</p>';weatherChecked=0;}
 finally{if(request===weatherRequest)weatherBusy=false;}
}
updateWeather();setInterval(updateWeather,5*60*1000);
document.addEventListener('visibilitychange',updateWeather);
window.addEventListener('online',updateWeather);
