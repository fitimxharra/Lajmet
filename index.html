<script>

// ===== BURIMET =====
// hint = kategoria e sigurt kur feed-i është feed kategorie (p.sh. /sport/feed/).

const FEEDS = [
 {src:'Reporteri',url:'https://reporteri.net/feed/'},
 {src:'Reporteri',url:'https://reporteri.net/sport/feed/',hint:'sport'},
 {src:'Reporteri',url:'https://reporteri.net/lajme/bote/feed/',hint:'world'},

 {src:'Gazeta Express',url:'https://www.gazetaexpress.com/feed/'},
 {src:'KultPlus',url:'https://www.kultplus.com/feed/',hint:'culture'},
 {src:'Nacionale',url:'https://nacionale.com/',kind:'website'},
 {src:'Zëri',url:'https://zeri.info/',kind:'website'},
 {src:'TopSporti',url:'https://topsporti.com/feed/',hint:'sport'}
];
const REFRESH_MS=5*60*1000;
const sourceStatus={};
const MAX_PER_CAT = 150;               // sa lajme mbahen për kategori
const MAX_AGE_MS = 4*24*3600*1000;     // lajmet më të vjetra se 4 ditë hiqen
const CACHE_KEY="readableNewsCacheV3", CACHE_AT_KEY="readableNewsCacheAtV3";
function isRemovedSource(n){return /bota\s*sot/i.test(n?.source||'')||/(^|\.)botasot\.info$/i.test((()=>{try{return new URL(n.url).hostname}catch{return ''}})());}
let news = [];
try {
  const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"[]");
  const cachedAt=Number(localStorage.getItem(CACHE_AT_KEY)||"0");
  if(Date.now()-cachedAt < 30*60*1000 && Array.isArray(cached)) news=cached.filter(n=>n&&n.title&&n.cat&&safeURL(n.url)&&!isRemovedSource(n));
} catch {}
let loading = true;

// ===== KATEGORIZIMI =====
// Rendi i sigurisë: 1) feed kategorie  2) kategoritë RSS të vetë portalit
// 3) seksioni në URL  4) fjalë kyçe me pikë (vetëm si mundësi e fundit).
function norm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
}
const CAT_PRIORITY=["sport","culture","other","world","national"];
const LABEL_RX={
  sport:/\b(sport|sporti|sportet|sportive|futboll|futbolli|football|basketboll|basketbolli|basket|volejboll|hendboll|handboll|tenis|superliga|superliga e kosoves|premier league|champions league|liga e kampioneve|la liga|serie a|bundesliga|ligue 1|formula 1|boks|mma|ufc|atletike|olimpiada|lojerat olimpike|kombetarja|nba|euroliga|transferime|arena)\b/,
  culture:/\b(kulture|kultura|kulturore|art|arte|arti|muzike|muzika|film|filma|kinema|teater|teatri|letersi|libra|libri|poezi|trashegimi|ekspozite|festival|festivale)\b/,
  other:/\b(showbiz|magazina|magazine|lifestyle|stil jetese|tech|teknologji|teknologjia|auto|horoskop|horoskopi|receta|kuzhina|bukuri|moda|mode|argetim|kuriozitete|curiozitete|fun)\b/,
  world:/\b(bote|bota|world|nderkombetare|nderkombetar|globale|rajoni|rajon|europa|evropa|amerika|lindja e mesme)\b/,
  national:/\b(lajme|lajmet|kosove|kosova|shqiperi|shqiperia|politike|politika|aktuale|aktualitet|ekonomi|ekonomia|biznes|sociale|kronike|kronika|nacionale|maqedoni|lugina|diaspora|siguri|drejtesi|shendetesi|arsim)\b/
};
const URL_SEG={
  "futboll-sporti":"sport","basketboll-sporti":"sport",sport:"sport",sporti:"sport",sportet:"sport",sportive:"sport",futboll:"sport",
  bote:"world",bota:"world",world:"world",globale:"world",rajoni:"world",rajon:"world",
  kulture:"culture",kultura:"culture",kulturore:"culture",art:"culture",
  showbiz:"other",magazina:"other",lifestyle:"other",tech:"other",teknologji:"other",
  lajme:"national",politike:"national",aktuale:"national",sociale:"national",ekonomi:"national",
  kosove:"national",kosova:"national",shqiperi:"national",opinion:"national"
};
function pickByPriority(found){ return CAT_PRIORITY.find(c=>found.includes(c))||null; }
function catFromLabels(labels){
  const found=[];
  labels.map(norm).forEach(l=>{ for(const c of CAT_PRIORITY) if(LABEL_RX[c].test(l)) found.push(c); });
  return pickByPriority(found);
}
function catFromUrl(url){
  try{
    const segs=new URL(url).pathname.split("/").filter(Boolean).map(norm);
    segs.pop(); // segmenti i fundit është titulli i artikullit, jo seksioni
    return pickByPriority(segs.map(s=>URL_SEG[s]).filter(Boolean));
  }catch{return null;}
}
// [regex, pikë]; kategoria fiton vetëm me ≥2 pikë
const KW={
  sport:[
    [/\b(futboll|basketboll|volejboll|hendboll|superlig|premier league|champions league|liga e kampioneve|conference league|europa league|la liga|serie a|bundesliga|ligue 1|uefa|fifa|formula 1|grand prix|olimpiad|dardanet|kombetarja|kampionat|golashenues|mesfushor|portier|nba|euroliga|atp|wta|ufc|wimbledon|roland garros|mundial|merkato|transferim)/,2],
    [/\b(ndeshj|gol|golin|golat|trajner|klub|stadium|lojtar|skuadr|barazim|tenis|boks|real madrid|barcelona|liverpool|juventus|chelsea|arsenal|manchester|bayern|psg|messi|ronaldo|mbappe|xhaka|haaland|muriqi|rashica)/,1]
  ],
  culture:[
    [/\b(koncert|festival|ekspozit|teat[e]?r|film|kinema|opera|balet|muze|letersi|poezi|poet|shkrimtar|piktor|piktur|regjisor|trashegimi|bibliotek|librin|romanin)/,2],
    [/\b(album|kenge|artist|aktor|skulptur|galeri)/,1]
  ],
  other:[
    [/\b(horoskop|recet|showbiz|dieta|bukuri|celebrit|influencer|bikini|shtatzan|fejes|ish-partner|e dashura|i dashuri)/,2],
    [/\b(instagram|tiktok|pozon|poza|publikon foto|dashuri)/,1]
  ],
  world:[
    [/\b(ukrain|rusi|putin|zelensk|kremlin|moskv|kiev|kyiv|nato|izrael|gaza|hamas|hezbollah|iran|kin[ae]\b|pekin|japoni|kore|indi[ae]\b|pakistan|turqi|erdogan|gjermani|franc|macron|britani|londr|itali|spanj|shba|sha-|washington|uashington|trump|kombet e bashkuara|okb|brukse|siri|irak|afganistan|venezuel|brazil|meksik|kanada)/,2],
    [/\b(serbi|vucic|beograd|bosnj|mal i zi|kroaci|greqi|bullgari|rumani|hungari|orban|poloni|austri|zvicr|europ|evrop)/,1]
  ],
  national:[
    [/\b(kosov|prishtin|kurti|osmani|shqiper|tiran|rama\b|mitrovic|prizren|peje|gjakov|ferizaj|gjilan|vetevendosje|ldk|pdk|aak|kuvend|abdixhiku|haradinaj|hamza|luginen|presheve|shkup|tetov)/,2],
    [/\b(qeveri|ministr|polici|gjykat|prokurori|komun)/,1]
  ]
};
function catFromKeywords(text){
  const t=norm(text);
  const score={};
  // çdo fjalë e ndryshme që gjendet shton pikë
  for(const c in KW) score[c]=KW[c].reduce((s,[rx,w])=>s+new Set(t.match(new RegExp(rx.source,"g"))||[]).size*w,0);
  // lajmet që përmendin Kosovën/Shqipërinë mbeten "Lajme", edhe me aktorë të huaj
  if(score.national>=2) score.world=0;
  const order=["sport","other","culture","national","world"];
  let best="national",bestScore=1;
  for(const c of order) if(score[c]>bestScore){best=c;bestScore=score[c];}
  return best;
}
function classifyItem({title,url,summary,rssCats,hint}){
  if(hint) return {cat:hint,conf:4};
  const r=catFromLabels(rssCats||[]); if(r) return {cat:r,conf:3};
  const u=catFromUrl(url); if(u) return {cat:u,conf:2};
  return {cat:catFromKeywords((title||"")+" "+(summary||"")),conf:1};
}
function activeSources(){
  const pool=category==="all"?news:news.filter(n=>n.cat===category);
  return [...new Set(pool.map(n=>n.source))];
}
const labels={national:"Lajme",world:"Botë",sport:"Sport",culture:"Kulturë",other:"Magazinë"};
let category="all", sourceFilter="all";
let saved; let savedArticles={};
try{
  saved=new Set(JSON.parse(localStorage.getItem("savedReadableNewsV2")||"[]"));
  savedArticles=JSON.parse(localStorage.getItem("savedReadableNewsArticlesV1")||"{}")||{};
}catch{saved=new Set();savedArticles={}}
function persistSaved(){
  try{
    localStorage.setItem("savedReadableNewsV2",JSON.stringify([...saved]));
    localStorage.setItem("savedReadableNewsArticlesV1",JSON.stringify(savedArticles));
  }catch{}
}
function toggleSave(id){
  const n=news.find(x=>x.id===id)||savedArticles[id];
  if(saved.has(id)){
    saved.delete(id);
    delete savedArticles[id];
  }else{
    saved.add(id);
    if(n) savedArticles[id]=n;
  }
  persistSaved();
  if(n && !news.some(x=>x.id===id)) news.push(n);
  render();renderSaved();
}
function toast(msg){
  let el=document.getElementById("toast");
  if(!el){el=document.createElement("div");el.id="toast";el.className="toast";document.body.appendChild(el);}
  el.textContent=msg;el.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2200);
}
async function shareArticle(id){
  const n=news.find(x=>x.id===id)||savedArticles[id];
  if(!n) return;
  const title=(n.title||"").replace(/\s+—\s+.*$/,"");
  const text=title+" — "+(n.source||"Lajmet e mia");
  const url=n.url||location.href;
  if(navigator.share){
    try{await navigator.share({title,text,url});toast("Artikulli u nda.");return;}catch(e){if(e&&e.name==="AbortError")return;}
  }
  const panel=`
    <div class="share-bar">
      <a target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(text+" "+url)}">WhatsApp</a>
      <a target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}">Facebook</a>
      <a target="_blank" rel="noopener" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}">X</a>
      <a target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}">Telegram</a>
      <button type="button" data-copy-link="${esc(url)}">Kopjo linkun</button>
    </div>`;
  const box=document.getElementById("shareBox");
  if(box) box.innerHTML=panel;
  else toast("Hap opsionet e ndarjes në artikull.");
}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
function relTime(iso){
  const t=Date.parse(iso); if(!t) return "";
  const m=Math.max(0,Math.round((Date.now()-t)/60000));
  if(m<1) return "tani";
  if(m<60) return m+" min më parë";
  const h=Math.round(m/60);
  if(h<24) return h+" orë më parë";
  return Math.round(h/24)+" ditë më parë";
}
function safeURL(v){try{const u=new URL(v);if(u.protocol==="http:")u.protocol="https:";const path=(u.pathname||"").replace(/\/+$/,"");if(u.protocol!=="https:"||!path)return null;return u.href}catch{return null}}
function chips(){
  document.querySelectorAll('#mainNav button').forEach(button=>{
    const selected=(button.dataset.cat||'all')===category;
    button.classList.toggle('on',selected);
    button.setAttribute('aria-pressed',String(selected));
  });
}
function classify(n){ return (n&&n.cat)||"national"; }
function filtered(){
  return news.filter(n=>{
    if(sourceFilter!=="all" && n.source!==sourceFilter) return false;
    if(category==="all") return true;
    return n.cat===category;
  });
}
function interleaveByCategory(items){
  const groups={};
  items.forEach(n=>{
    const k=n.cat||"national";
    (groups[k]||(groups[k]=[])).push(n);
  });
  const keys=Object.keys(groups);
  const out=[];
  let i=0, added=true;
  while(added){
    added=false;
    for(const k of keys){
      if(groups[k][i]){out.push(groups[k][i]);added=true;}
    }
    i++;
  }
  return out;
}
function visitKey(){
  try{
    const k="newsVisitCountV2";
    const n=Number(localStorage.getItem(k)||"0")+1;
    localStorage.setItem(k,String(n));
    return n;
  }catch{return Date.now();}
}
let thisVisit=visitKey();
let featIndex=0;
let featTimer=null;
function startFeatRotate(count){
  clearInterval(featTimer);
  if(count<2) return;
  featTimer=setInterval(()=>{
    featIndex=(featIndex+1)%count;
    const track=$("featTrack");
    if(track) track.style.transform="translateX(-"+(featIndex%count)*100+"%)";
    const num=$("featNum");
    if(num) num.textContent=String(featIndex+1).padStart(2,"0")+" / "+String(count).padStart(2,"0");
    document.querySelectorAll(".feat-dots button").forEach((b,i)=>b.classList.toggle("on",i===featIndex));
  },6000);
}
function feedPage(){ return 1; }
function pickFeatured(items){
  return items[0]||null;
}
function hoursAgo(n){
  const t=Date.parse(n&&n.publishedAt);
  if(!t) return 72;
  return (Date.now()-t)/3600000;
}
function topicKey(title){
  return String(title||"").toLowerCase()
    .replace(/[“”"«»]/g,"")
    .split(/[^a-zëçàäöü0-9]+/i)
    .filter(w=>w.length>3 && !/^(pas|në|nga|për|edhe|this|that|with|from|after)$/i.test(w))
    .slice(0,4).join(" ");
}
function trendScore(n, pool){
  const h=hoursAgo(n);
  let s=Math.max(0,36-h)*3;
  if(h<1) s+=28;
  else if(h<3) s+=18;
  else if(h<8) s+=10;
  const title=(n.title||"").toLowerCase();
  if(/vritet|shpërthen|arresto|protest|luft|godit|aksident|ekskluzive|breaking|live|kriz|masakër|tërrmet|hagë|speciale/.test(title)) s+=16;
  const key=topicKey(n.title);
  if(key){
    const echoes=pool.filter(o=>o!==n && topicKey(o.title)===key).length;
    s+=echoes*12;
  }
  return s;
}
function arranged(items){
  return items.slice().sort((a,b)=>(Date.parse(b.publishedAt)||0)-(Date.parse(a.publishedAt)||0));
}

const categoryState={};
// "Shfaq më shumë": merr faqet e vjetra të feed-eve për këtë kategori
async function loadCategory(cat,more=false){
  const feeds=FEEDS.filter(f=>f.kind!=="website" && (!f.hint || f.hint===cat));
  const state=categoryState[cat]||(categoryState[cat]={page:1,busy:false});
  if(state.busy) return;
  if(!more) state.page=1;
  state.busy=true;
  const page=state.page+1;
  if(category===cat){$("loadStatus").textContent="Duke ngarkuar më shumë lajme: "+labels[cat]+"…";render();}
  const batches=await Promise.all(feeds.map(async f=>{
    try{
      const url=new URL(f.url); url.searchParams.set("paged",String(page));
      const items=await fetchArticles({...f,url:url.href});
      return items.filter(n=>n.cat===cat);
    }catch{return null;}
  }));
  const added=mergeNews(batches.filter(Boolean).flat(),{prune:false});
  if(batches.some(b=>b&&b.length)) state.page=page;
  state.busy=false;
  if(category===cat){
    chips();render();
    $("loadStatus").textContent=added?"U shtuan "+added+" lajme te "+labels[cat]+".":"Nuk u gjetën lajme shtesë.";
  }
  renderSaved();
}
function render(){
  const state=categoryState[category];
  $("loadMore").hidden=category==="all";
  $("loadMore").disabled=Boolean(state?.busy);
  $("loadMore").textContent=state?.busy?"Duke ngarkuar…":"Shfaq më shumë lajme";
  let items=arranged(filtered());
  if(sourceFilter==="all"&&category==="all") items=items.slice(0,40);
  const top=items.slice(0,1);
  const rest=items.slice(1); // The lead story is shown once.
  const feat=top[featIndex%Math.max(top.length,1)]||null;
  $("featNum").textContent=top.length?String((featIndex%top.length)+1).padStart(2,"0")+" / "+String(top.length).padStart(2,"0"):"—";
  $("featured").innerHTML=top.length?`
    ${top.length>1?`<button class="feat-nav prev" type="button" data-feat-dir="-1" aria-label="Artikulli paraprak">‹</button>
    <button class="feat-nav next" type="button" data-feat-dir="1" aria-label="Artikulli tjetër">›</button>`:''}
    <div class="feat-track" id="featTrack" style="transform:translateX(-${(featIndex%top.length)*100}%)">
      ${top.map(n=>`
      <div class="feat-slide">
        ${n.image?`<div class="hero" data-open="${n.id}"><img src="${esc(n.image)}" alt="" onerror="this.parentNode.style.display='none'"><span class="hero-label">${labels[n.cat]||'Lajme'}</span></div>`:''}
        <div class="feature-body">
          <div class="kicker">${esc(n.source)} · ${labels[n.cat]||'Lajme'}</div>
          <h3 class="headline"><button data-open="${n.id}">${esc((n.title||'').replace(/\s+—\s+.*$/,''))}</button></h3>
          <p class="feat-excerpt">${esc(n.summary||'')}</p>
          <div class="row-act"><button class="link" data-open="${n.id}">Lexo artikullin <span aria-hidden="true">↗</span></button>
          <div style="display:flex;gap:8px">
          <button class="bm" data-share="${n.id}" aria-label="Ndaj artikullin" title="Ndaj">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 16V4m0 0 4 4M12 4 8 8"/></svg>
          </button>
          <button class="bm ${saved.has(n.id)?'on':''}" data-save="${n.id}" aria-label="${saved.has(n.id)?'Hiq nga të ruajturat':'Ruaj artikullin'}" aria-pressed="${saved.has(n.id)}"><svg viewBox="0 0 24 24" fill="${saved.has(n.id)?'currentColor':'none'}" stroke="currentColor" stroke-width="1.7"><path d="M7 4h10v16l-5-3-5 3z"/></svg></button></div></div>
        </div>
      </div>`).join('')}
    </div>
    ${top.length>1?`<div class="feat-dots">${top.map((_,i)=>`<button type="button" data-feat-go="${i}" class="${i===(featIndex%top.length)?'on':''}" aria-label="Artikulli ${i+1}"></button>`).join('')}</div>`:''}
  `:`<p class="empty">${loading?'Duke ngarkuar artikujt…':'Nuk ka artikuj në këtë filtër.'}</p>`;
  startFeatRotate(top.length);
  $("feed").innerHTML=rest.map((n,i)=>`
    <article data-open="${n.id}" tabindex="0" role="button">
      <div>

function parseDate(v){
  let s=String(v||"").trim();
  if(!s) return "";
  // rss2json kthen "YYYY-MM-DD HH:mm:ss" në UTC pa zonë kohore
  if(/^\d{4}-\d\d-\d\d \d\d:\d\d(:\d\d)?$/.test(s)) s=s.replace(" ","T")+"Z";
  let t=Date.parse(s);
  if(isNaN(t)) return "";
  if(t>Date.now()+5*60000) t=Date.now();
  return new Date(t).toISOString();
}
function mapRssItems(feed, items){
  return (items||[]).flatMap(item=>{
    const link=item.link||item.url||item.guid||"";
    if(/#comment|\/comment-page-/i.test(link)) return [];
    const url=safeURL(link);

    if(!url || !title || /^(comment on|koment)/i.test(title)) return [];
    const content=item.content||item.description||item.content_html||"";
    const body=strip(content);
    const summary=strip(item.description||content).slice(0,180);
    const rssCats=(item.categories||[]).map(c=>typeof c==="string"?c:(c&&(c.name||c.term))||"").filter(Boolean);
    const {cat,conf}=classifyItem({title,url,summary,rssCats,hint:feed.hint});
    const img=(content.match(/<img[^>]+src=["']([^"']+)["']/i)||[])[1];
    return [{id:stableId(url),source:feed.src,title,url,cat,catConf:conf,rssCats,
      summary,content,body,
      image:item.thumbnail||(item.enclosure&&item.enclosure.link)||item.image||img||"",author:item.author||feed.src,
      publishedAt:parseDate(item.pubDate||item.published||item.date),
      previewOnly:body.length<400}];
  });
}

function xmlToItems(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.querySelector("parsererror")) return [];
  const nodes=[...doc.querySelectorAll("item, entry")];
  return nodes.map(el=>{
    const t=s=>{const n=el.querySelector(s);return n?n.textContent.trim():"";};
    const tag=name=>{const n=el.getElementsByTagName(name)[0];return n?n.textContent.trim():"";};
    let link=t("link");
    if(!link){const a=el.querySelector("link[href]");if(a)link=a.getAttribute("href")||"";}
    if(!link) link=t("guid");
    const media=el.querySelector("enclosure[url], media\\:content, content[url], thumbnail[url]");
    return {
      title:t("title"),
      link,
      pubDate:t("pubDate")||t("published")||t("updated")||tag("dc:date"),
      description:t("description")||t("summary"),
      content:tag("content:encoded")||t("content")||t("description"),
      categories:[...el.querySelectorAll("category")].map(c=>c.getAttribute("term")||c.textContent.trim()).filter(Boolean),
      thumbnail:media?(media.getAttribute("url")||""):""
    };
  }).filter(i=>i.title&&i.link);
}
async function grab(url,ms=15000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),ms);
  try{
    const res=await fetch(url,{signal:controller.signal,cache:"no-store"});
    if(!res.ok) return null;
    return await res.text();
  }catch{return null;}
  finally{clearTimeout(timer);}
}
const pendingFeeds=new Map();
async function fetchJsonRss(feed){
 if(pendingFeeds.has(feed))return pendingFeeds.get(feed);
 const work=(async()=>{
   // Keep the publisher URL stable: changing it creates a new conversion job.
   const endpoint='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed);
   for(let attempt=0;attempt<2;attempt++){
     const text=await grab(endpoint,20000);
     try{const data=JSON.parse(text);if(data?.status==='ok'&&Array.isArray(data.items)&&data.items.length)return data.items;}catch{}
     if(attempt===0){
       const xml=await grab(feed,10000);
       if(xml){const items=xmlToItems(xml);if(items.length)return items;}
     }
   }
   throw new Error('RSS nuk u përgjigj');
 })();
 pendingFeeds.set(feed,work);try{return await work;}finally{pendingFeeds.delete(feed);}
}
async function publicPage(url){
 for(const endpoint of [url,'https://api.allorigins.win/raw?url='+encodeURIComponent(url)]){
   const html=await grab(endpoint,15000);
   if(html && /<html[\s>]/i.test(html) && !/cf-chl-|Just a moment|Access denied/i.test(html.slice(0,6000)))return html;
 }
 return '';
}
function websiteArticle(feed,url,html){
 const doc=new DOMParser().parseFromString(html,'text/html');
 const meta=k=>doc.querySelector('meta[property="'+k+'"],meta[name="'+k+'"]')?.getAttribute('content')||'';
 const schemas=[];
 function visit(v){if(!v||typeof v!=='object')return;if(Array.isArray(v)){v.forEach(visit);return;}if(/Article|NewsArticle|BlogPosting/.test(String(v['@type'])))schemas.push(v);if(v['@graph'])visit(v['@graph']);}
 doc.querySelectorAll('script[type="application/ld+json"]').forEach(el=>{try{visit(JSON.parse(el.textContent));}catch{}});
 const schema=schemas[0]||{};
 const title=String(schema.headline||meta('og:title')||doc.querySelector('h1')?.textContent||'').trim();
 if(!title)return null;
 const description=meta('og:description')||schema.description||'';
 let text=schema.articleBody||'';
 if(!text){
   const body=doc.querySelector('[itemprop="articleBody"],.article-content,.article-body,.article-text,.entry-content,.post-content,article');
   if(body){body.querySelectorAll('script,style,nav,aside,footer,.related,.share,.ads').forEach(x=>x.remove());text=[...body.querySelectorAll('p')].map(x=>x.textContent.trim()).filter(x=>x.length>35).join('\n\n');}
 }
 const previewOnly=!text;text=text||description;if(!text)return null;
 const published=parseDate(schema.datePublished||meta('article:published_time')||doc.querySelector('time[datetime]')?.getAttribute('datetime'));
 const summary=strip(description||text).slice(0,180);
 const {cat,conf}=classifyItem({title,url,summary,rssCats:[schema.articleSection||''],hint:feed.hint});
 const author=typeof schema.author==='string'?schema.author:schema.author?.name||meta('author')||feed.src;
 return {id:stableId(url),source:feed.src,title,url,cat,catConf:conf,summary,content:text,body:text,image:meta('og:image'),author,publishedAt:published,previewOnly};
}
async function fetchWebsite(feed){

 const doc=new DOMParser().parseFromString(html,'text/html');const home=new URL(feed.url);
 const urls=[...new Set([...doc.querySelectorAll('a[href]')].map(a=>{
   try{const u=new URL(a.getAttribute('href'),home);if(u.hostname.replace(/^www\./,'')!==home.hostname.replace(/^www\./,''))return null;
     if(!/^\/[^/]+\/[^/]+/.test(u.pathname)||/\.(jpg|png|pdf)|\/page\//i.test(u.pathname))return null;
     u.hash='';u.search='';return safeURL(u.href);
   }catch{return null;}
 }).filter(Boolean))].slice(0,10);

 return items;
}

function readableContent(content, description){
  if(!content) return false;
  const text=strip(content);
  // Reject short excerpts and explicit "continue reading" truncation markers.
  return text.length >= 500 && text.split(/\s+/).length >= 80
    && !/(\[\s*…\s*\]|\[\s*\.\.\.\s*\]|class=["'][^"']*more-link|continue reading|lexo më shumë)/i.test(content);
}

function saveCache(){
  try{

    const slim=news.filter(n=>{perCat[n.cat]=(perCat[n.cat]||0)+1;return perCat[n.cat]<=40;});
    localStorage.setItem(CACHE_KEY,JSON.stringify(slim));

  }catch{}

// Bashkon lajmet e reja me ato ekzistuese; kthen numrin e lajmeve të reja
function mergeNews(incoming,{prune=true}={}){
  const map=new Map(news.map(n=>[n.url,n]));
  let fresh=0;
  for(const n of incoming){
    const old=map.get(n.url);
    if(!old){
      map.set(n.url,{...n,newAt:initialDone?Date.now():0});
      fresh++;
      continue;
    }
    // kategoria me burim më të sigurt fiton (p.sh. feed-i /sport/ mbi fjalët kyçe)
    const keepOld=(old.catConf||0)>(n.catConf||0);
    map.set(n.url,{...old,...n,cat:keepOld?old.cat:n.cat,catConf:Math.max(old.catConf||0,n.catConf||0),newAt:old.newAt});
  }
  let list=[...map.values()].sort((a,b)=>(Date.parse(b.publishedAt)||0)-(Date.parse(a.publishedAt)||0));
  if(prune){
    const cutoff=Date.now()-MAX_AGE_MS, count={};
    list=list.filter(n=>{
      if(saved.has(n.id)) return true;
      if(n.publishedAt && (Date.parse(n.publishedAt)||0)<cutoff) return false;
      count[n.cat]=(count[n.cat]||0)+1;
      return count[n.cat]<=MAX_PER_CAT;
    });
  }
  news=list;
  saveCache();
  return fresh;
}
function isNew(n){ return n.newAt && Date.now()-n.newAt<15*60000; }
function scheduleNext(){
  clearTimeout(refreshTimer);
  nextRefresh=Math.max(Date.now()+1000,(refreshStarted||Date.now())+REFRESH_MS);
  refreshTimer=setTimeout(()=>refreshAll({silent:true}),nextRefresh-Date.now());
}
async function refreshAll(opts={}){
  const silent=!!opts.silent;
  if(refreshing) return;
  // kur aplikacioni është në sfond nuk harxhojmë kërkesa; rifreskohet kur rikthehesh
  if(silent && document.hidden){ clearTimeout(refreshTimer); nextRefresh=0; return; }
  refreshing=true; refreshStarted=Date.now(); updateRefreshInfo();
  if(!silent && !news.length){ loading=true; render(); }
  $("loadStatus").textContent=silent?"Duke kontrolluar lajme të reja…":"Duke ngarkuar lajmet e fundit nga të gjitha burimet…";
  let fresh=0, ok=false, okFeeds=0;
  const before=new Set(news.map(n=>n.url));
  try{
    const incoming=[];let cursor=0;
    const names=[...new Set(FEEDS.map(f=>f.src))];
    names.forEach(name=>sourceStatus[name]={state:'loading',count:0});renderSourceList();
    await Promise.all(Array.from({length:5},async()=>{
      while(cursor<FEEDS.length){
        const f=FEEDS[cursor++];
        try{
          const batch=await fetchArticles(f);
          if(batch.length){okFeeds++;incoming.push(...batch);sourceStatus[f.src]={state:'ok',count:(sourceStatus[f.src]?.count||0)+batch.length};mergeNews(batch);chips();render();}
          else if(sourceStatus[f.src]?.state!=='ok')sourceStatus[f.src]={state:'empty',count:0};
        }catch{if(sourceStatus[f.src]?.state!=='ok')sourceStatus[f.src]={state:'error',count:0};}
        renderSourceList();
      }
    }));
    ok=incoming.length>0;
    if(ok){fresh=new Set(incoming.filter(n=>!before.has(n.url)).map(n=>n.url)).size;mergeNews(incoming);lastSuccess=Date.now();}
  }finally{
    refreshing=false; loading=false; initialDone=true;
    lastRefresh=Date.now(); scheduleNext();
  }
  const where=category==="all"?"":" ("+labels[category]+")";
  $("loadStatus").textContent=ok
    ? (fresh?"U gjetën "+fresh+" lajme të reja nga "+okFeeds+" burime. Kontrolli i radhës pas 5 min.":"Nuk ka lajme të reja"+where+" ("+okFeeds+" furnizime). Kontrolli i radhës pas 5 min.")
    : "Asnjë burim nuk u përgjigj. Riprovohet automatikisht pas 5 min.";
  if(sourceFilter!=="all" && !activeSources().includes(sourceFilter)) sourceFilter="all";
  const unavailable=Object.entries(sourceStatus).filter(([n,v])=>v.state!=='ok').map(([n])=>n);
  if(unavailable.length)$("loadStatus").textContent+=" Pa lajme të reja nga: "+unavailable.join(", ")+".";
  chips();render();renderSaved();renderSourceList();updateRefreshInfo();
}
function updateRefreshInfo(){
  const el=$("refreshInfo"); if(!el) return;
  if(refreshing){el.textContent="Duke kërkuar lajme të reja…";return;}
  if(!lastRefresh){el.textContent="Artikuj nga të gjitha burimet";return;}
  const left=Math.max(0,Math.round((nextRefresh-Date.now())/1000));
  const hhmm=new Date(lastRefresh).toLocaleTimeString("sq",{hour:"2-digit",minute:"2-digit"});
  el.textContent="Kontrolluar "+hhmm+" · tjetri pas "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
}

    e.preventDefault();e.stopPropagation();
    const dots=document.querySelectorAll(".feat-dots button");
    featIndex=Number(featGo.dataset.featGo);
    const track=$("featTrack");
    if(track) track.style.transform="translateX(-"+featIndex*100+"%)";
    const num=$("featNum");
    if(num) num.textContent=String(featIndex+1).padStart(2,"0")+" / "+String(dots.length).padStart(2,"0");
    dots.forEach((b,i)=>b.classList.toggle("on",i===featIndex));
    startFeatRotate(dots.length);
  }
  const copy=e.target.closest("[data-copy-link]");
  if(copy){
    const link=copy.dataset.copyLink;
    navigator.clipboard.writeText(link).then(()=>toast("Linku u kopjua.")).catch(()=>toast(link));
  }
  if(close){
    const el=$(close.dataset.close);
    if(el && el.close) el.close();
  }
});
document.querySelector(".tabbar").addEventListener("click",e=>{
  const b=e.target.closest("[data-tab]"); if(!b)return;
  document.querySelectorAll(".tabbar button").forEach(x=>x.classList.toggle("on",x===b));
  if(b.dataset.tab==="sources"){showSources();return;}
  if(b.dataset.tab==="saved"){
    $("homeView").hidden=true; $("savedView").hidden=false; renderSaved();
  }else{
    $("homeView").hidden=false; $("savedView").hidden=true;
  }
});
document.addEventListener("keydown",e=>{
  const card=e.target.closest("article[data-open]");
  if(card && (e.key==="Enter"||e.key===" ")){e.preventDefault();openArticle(Number(card.dataset.open));}
});
$("loadMore").onclick=()=>loadCategory(category,true);
const brandHome=document.querySelector('.brand-logo');brandHome&&brandHome.addEventListener('click',e=>{
  e.preventDefault();category='all';sourceFilter='all';
  $('homeView').hidden=false;$('savedView').hidden=true;
  document.querySelectorAll('#mainNav button').forEach(x=>x.classList.toggle('on',x.dataset.page==='home'));
  document.querySelectorAll('.tabbar button').forEach(x=>x.classList.toggle('on',x.dataset.tab==='home'));
  chips();render();window.scrollTo({top:0,behavior:'smooth'});
});
$("refresh").onclick=()=>refreshAll();
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden && Date.now()-refreshStarted>=REFRESH_MS) refreshAll({silent:true});
});
window.addEventListener('online',()=>refreshAll({silent:true}));
window.addEventListener('pageshow',()=>{if(!refreshing && Date.now()-refreshStarted>=REFRESH_MS)refreshAll({silent:true});});
setInterval(()=>{updateRefreshInfo();},1000);
$("searchBtn").onclick=showSources;
$("sourceSearch").oninput=renderSourceList;
const editionDate=document.getElementById('editionDate');
editionDate.textContent=new Intl.DateTimeFormat('sq',{day:'numeric',month:'long',year:'numeric'}).format(new Date());
editionDate.dateTime=new Date().toISOString();
news=news.filter(n=>!isRemovedSource(n));
for(const [id,n] of Object.entries(savedArticles)){if(isRemovedSource(n)){saved.delete(Number(id));delete savedArticles[id];}}
persistSaved();saveCache();
Object.values(savedArticles).forEach(n=>{if(n&&n.id&&!news.some(x=>x.id===n.id))news.push(n);});
chips();render();renderSaved();refreshAll();

// Weather loads independently so an unavailable forecast never blocks news.
const weatherCities=[
 {name:'Prishtinë',lat:42.6629,lon:21.1655},
 {name:'Prizren',lat:42.2139,lon:20.7397},
 {name:'Pejë',lat:42.6591,lon:20.2883},
 {name:'Gjakovë',lat:42.3803,lon:20.4308},
 {name:'Gjilan',lat:42.4635,lon:21.4694},
 {name:'Ferizaj',lat:42.3706,lon:21.1553},
 {name:'Mitrovicë',lat:42.8914,lon:20.8653}
];
let weatherCityIndex=0;
try{const name=localStorage.getItem('weatherCity');const index=weatherCities.findIndex(c=>c.name===name);if(index>=0)weatherCityIndex=index;}catch{}
let weatherBusy=false,weatherChecked=0,weatherRequest=0;
function showWeatherCity(){ $('weatherCity').textContent=weatherCities[weatherCityIndex].name; }
function changeWeatherCity(direction){
 weatherCityIndex=(weatherCityIndex+direction+weatherCities.length)%weatherCities.length;
 weatherRequest++;weatherBusy=false;weatherChecked=0;
 showWeatherCity();
 try{localStorage.setItem('weatherCity',weatherCities[weatherCityIndex].name);}catch{}
 $('weatherContent').innerHTML='<p class="weather-status">Duke ngarkuar motin…</p>';
 updateWeather();
}
$('weatherPrev').onclick=()=>changeWeatherCity(-1);
$('weatherNext').onclick=()=>changeWeatherCity(1);
showWeatherCity();
function weatherSymbol(code){if(code===0)return '☀';if(code<=2)return '⛅';if(code===3)return '☁';if(code<=48)return '≋';if(code>=95)return '⛈';if((code>=71&&code<=77)||code===85||code===86)return '❄';return '☂';}
function weatherDescription(code){if(code===0)return 'Kthjellët';if(code<=2)return 'Pjesërisht me re';if(code===3)return 'Me re';if(code<=48)return 'Mjegull';if(code>=95)return 'Stuhi';if((code>=71&&code<=77)||code===85||code===86)return 'Borë';return 'Shi';}
async function updateWeather(){
 if(weatherBusy||document.hidden||Date.now()-weatherChecked<15*60*1000)return;
 weatherBusy=true;
 const request=++weatherRequest,city=weatherCities[weatherCityIndex];
 try{
  const raw=await grab('https://api.open-meteo.com/v1/forecast?latitude='+city.lat+'&longitude='+city.lon+'&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FBelgrade&forecast_days=3',15000);
  if(request!==weatherRequest)return;
  const data=JSON.parse(raw);
  if(!Number.isFinite(data?.current?.temperature_2m)||!Array.isArray(data?.daily?.time)||data.daily.time.length<3)throw Error('Invalid forecast');
  const c=data.current,d=data.daily;const temp=x=>Number.isFinite(x)?Math.round(x)+'°':'—';
  $('weatherContent').innerHTML=`<div class="weather-now"><div class="weather-temp"><span aria-hidden="true">${weatherSymbol(c.weather_code)}</span>${temp(c.temperature_2m)}</div></div><p class="weather-desc">${weatherDescription(c.weather_code)} · ${temp(d.temperature_2m_max[0])} / ${temp(d.temperature_2m_min[0])}</p><div class="weather-days">${d.time.slice(0,3).map((day,i)=>`<div><small>${i===0?'Sot':new Intl.DateTimeFormat('sq',{weekday:'short',timeZone:'Europe/Belgrade'}).format(new Date(day+'T12:00:00Z'))}</small><span aria-label="${weatherDescription(d.weather_code[i])}">${weatherSymbol(d.weather_code[i])}</span> ${temp(d.temperature_2m_max[i])}</div>`).join('')}</div>`;
  weatherChecked=Date.now();
 }catch{if(request!==weatherRequest)return;$('weatherContent').innerHTML='<p class="weather-status">Moti nuk është i disponueshëm. Provojmë përsëri së shpejti.</p>';weatherChecked=0;}
 finally{if(request===weatherRequest)weatherBusy=false;}
}
updateWeather();setInterval(updateWeather,5*60*1000);
document.addEventListener('visibilitychange',updateWeather);
window.addEventListener('online',updateWeather);

</script>
