<script>
function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  const dark=theme==='dark';
  const button=document.getElementById('themeToggle');
  button.setAttribute('aria-pressed',String(dark));
  button.setAttribute('aria-label',dark?'Aktivizo pamjen e bardhë':'Aktivizo pamjen e errët');
  button.title=dark?'Pamja e bardhë':'Pamja e errët';
  document.getElementById('themeColor').content=dark?'#151715':'#f5f3ee';
}
applyTheme(document.documentElement.dataset.theme);
document.getElementById('themeToggle').addEventListener('click',()=>{
  const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
  applyTheme(theme);
  try{localStorage.setItem('newsTheme',theme);}catch{}
});
// ===== BURIMET =====
// hint = kategoria e sigurt kur feed-i është feed kategorie (p.sh. /sport/feed/).
// Feed-et që nuk ekzistojnë anashkalohen pa problem.
const FEEDS = [
  {src:"Reporteri",      url:"https://reporteri.net/feed/"},
  {src:"Reporteri",      url:"https://reporteri.net/lajme/feed/"},
  {src:"Reporteri",      url:"https://reporteri.net/sport/feed/",       hint:"sport"},
  {src:"Reporteri",      url:"https://reporteri.net/lajme/bote/feed/",  hint:"world"},
  {src:"Telegrafi",      url:"https://telegrafi.com/feed/"},
  {src:"Telegrafi",      url:"https://telegrafi.com/sport/feed/",       hint:"sport"},
  {src:"Telegrafi",      url:"https://telegrafi.com/bota/feed/",        hint:"world"},
  {src:"Telegrafi",      url:"https://telegrafi.com/kultura/feed/",     hint:"culture"},
  {src:"Gazeta Express", url:"https://www.gazetaexpress.com/feed/"},
  {src:"Gazeta Express", url:"https://www.gazetaexpress.com/sport/feed/", hint:"sport"},
  {src:"KultPlus",       url:"https://www.kultplus.com/feed/",          hint:"culture"},
  {src:"Nacionale",      url:"nacionale:home"}
];
const REFRESH_MS = 3*60*1000;          // çdo 3 minuta
const MAX_PER_CAT = 150;               // sa lajme mbahen për kategori
const MAX_AGE_MS = 4*24*3600*1000;     // lajmet më të vjetra se 4 ditë hiqen
const CACHE_KEY="readableNewsCacheV3", CACHE_AT_KEY="readableNewsCacheAtV3";
let news = [];
try {
  const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"[]");
  const cachedAt=Number(localStorage.getItem(CACHE_AT_KEY)||"0");
  if(Date.now()-cachedAt < 30*60*1000 && Array.isArray(cached)) news=cached.filter(n=>n&&n.title&&n.cat&&safeURL(n.url));
} catch {}
let loading = true;

// ===== KATEGORIZIMI =====
// Rendi i sigurisë: 1) feed kategorie  2) kategoritë RSS të vetë portalit
// 3) seksioni në URL  4) fjalë kyçe me pikë (vetëm si mundësi e fundit).
function norm(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
}
const CAT_PRIORITY=["sport","culture","other","world","national"];
const LABEL_RX={

const KW={
  sport:[
    [/\b(futboll|basketboll|volejboll|hendboll|superlig|premier league|champions league|liga e kampioneve|conference league|europa league|la liga|serie a|bundesliga|ligue 1|uefa|fifa|formula 1|grand prix|olimpiad|dardanet|kombetarja|kampionat|golashenues|mesfushor|portier|nba|euroliga|atp|wta|ufc|wimbledon|roland garros|mundial|merkato|transferim)/,2],

    [/\b(album|kenge|artist|aktor|skulptur|galeri)/,1]
  ],

    [/\b(instagram|tiktok|pozon|poza|publikon foto|dashuri)/,1]
  ],

    [/\b(ukrain|rusi|putin|zelensk|kremlin|moskv|kiev|kyiv|nato|izrael|gaza|hamas|hezbollah|iran|kin[ae]\b|pekin|japoni|kore|indi[ae]\b|pakistan|turqi|erdogan|gjermani|franc|macron|britani|londr|itali|spanj|shba|sha-|washington|uashington|trump|kombet e bashkuara|okb|brukse|siri|irak|afganistan|venezuel|brazil|meksik|kanada)/,2],
    [/\b(serbi|vucic|beograd|bosnj|mal i zi|kroaci|greqi|bullgari|rumani|hungari|orban|poloni|austri|zvicr|europ|evrop)/,1]
  ],

    [/\b(qeveri|ministr|polici|gjykat|prokurori|komun)/,1]

};
function catFromKeywords(text){
  const t=norm(text);
  const score={};
  // çdo fjalë e ndryshme që gjendet shton pikë
  for(const c in KW) score[c]=KW[c].reduce((s,[rx,w])=>s+new Set(t.match(new RegExp(rx.source,"g"))||[]).size*w,0);
  // lajmet që përmendin Kosovën/Shqipërinë mbeten "Lajme", edhe me aktorë të huaj
  if(score.national>=2) score.world=0;
  const order=["sport","other","culture","national","world"];
  let best="national",bestScore=1;
  for(const c of order) if(score[c]>bestScore){best=c;bestScore=score[c];}
  return best;
}

  const u=catFromUrl(url); if(u) return {cat:u,conf:2};
  return {cat:catFromKeywords((title||"")+" "+(summary||"")),conf:1};
}

function relTime(iso){

function interleaveByCategory(items){
  const groups={};
  items.forEach(n=>{
    const k=n.cat||"national";
    (groups[k]||(groups[k]=[])).push(n);
  });
  const keys=Object.keys(groups);
  const out=[];
  let i=0, added=true;
  while(added){
    added=false;
    for(const k of keys){
      if(groups[k][i]){out.push(groups[k][i]);added=true;}
    }
    i++;
  }
  return out;
}

function topicKey(title){

    .filter(w=>w.length>3 && !/^(pas|në|nga|për|edhe|this|that|with|from|after)$/i.test(w))

}
function trendScore(n, pool){
  const h=hoursAgo(n);
  let s=Math.max(0,36-h)*3;
  if(h<1) s+=28;
  else if(h<3) s+=18;
  else if(h<8) s+=10;
  const title=(n.title||"").toLowerCase();
  if(/vritet|shpërthen|arresto|protest|luft|godit|aksident|ekskluzive|breaking|live|kriz|masakër|tërrmet|hagë|speciale/.test(title)) s+=16;
  const key=topicKey(n.title);
  if(key){
    const echoes=pool.filter(o=>o!==n && topicKey(o.title)===key).length;
    s+=echoes*12;
  }
  return s;
}

}

function itemImage(item, desc, content){
  const enc=item.querySelector("enclosure");
  const encUrl=enc && (enc.getAttribute("url")||enc.getAttribute("href"));
  const media=item.getElementsByTagName("media:content")[0]||item.getElementsByTagName("media:thumbnail")[0]||item.querySelector("thumbnail");
  const mediaUrl=media && (media.getAttribute("url")||media.textContent);
  const html=content||desc||"";
  const m=html.match(/<img[^>]+src=["']([^"']+)["']/i);
  const fromHtml=m?m[1]:"";
  const u=encUrl||mediaUrl||fromHtml||"";
  if(/^https?:\/\//i.test(u) && !/unsplash\.com/i.test(u)) return u;
  return "";
}
function parseDate(v){
  let s=String(v||"").trim();
  if(!s) return new Date().toISOString();
  // rss2json kthen "YYYY-MM-DD HH:mm:ss" në UTC pa zonë kohore
  if(/^\d{4}-\d\d-\d\d \d\d:\d\d(:\d\d)?$/.test(s)) s=s.replace(" ","T")+"Z";
  let t=Date.parse(s);
  if(isNaN(t)) return new Date().toISOString();
  if(t>Date.now()+5*60000) t=Date.now();
  return new Date(t).toISOString();
}
function mapRssItems(feed, items){
  return (items||[]).flatMap(item=>{
    const link=item.link||item.url||item.guid||"";
    if(/#comment|\/comment-page-/i.test(link)) return [];
    const url=safeURL(link);
    const title=String(item.title||"").trim();
    if(!url || !title || /^(comment on|koment)/i.test(title)) return [];
    const content=item.content||item.description||item.content_html||"";
    const body=strip(content);
    const summary=strip(item.description||content).slice(0,180);
    const rssCats=(item.categories||[]).map(c=>typeof c==="string"?c:(c&&(c.name||c.term))||"").filter(Boolean);
    const {cat,conf}=classifyItem({title,url,summary,rssCats,hint:feed.hint});
    const img=(content.match(/<img[^>]+src=["']([^"']+)["']/i)||[])[1];
    return [{id:stableId(url),source:feed.src,title,url,cat,catConf:conf,rssCats,
      summary,content,body,
      image:item.thumbnail||(item.enclosure&&item.enclosure.link)||item.image||img||"",author:item.author||feed.src,
      publishedAt:parseDate(item.pubDate||item.published||item.date),
      previewOnly:body.length<400}];
  });
}
// ===== MARRJA E FEED-EVE =====
// Provohen disa proxy; i pari që kthen lajme fiton. Kështu, nëse rss2json
// bie ose e kufizon numrin e kërkesave, aplikacioni vazhdon të punojë.
function xmlToItems(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.querySelector("parsererror")) return [];
  const nodes=[...doc.querySelectorAll("item, entry")];
  return nodes.map(el=>{
    const t=s=>{const n=el.querySelector(s);return n?n.textContent.trim():"";};
    const tag=name=>{const n=el.getElementsByTagName(name)[0];return n?n.textContent.trim():"";};
    let link=t("link");
    if(!link){const a=el.querySelector("link[href]");if(a)link=a.getAttribute("href")||"";}
    if(!link) link=t("guid");
    const media=el.querySelector("enclosure[url], media\\:content, content[url], thumbnail[url]");
    return {
      title:t("title"),
      link,
      pubDate:t("pubDate")||t("published")||t("updated")||tag("dc:date"),
      description:t("description")||t("summary"),
      content:tag("content:encoded")||t("content")||t("description"),
      categories:[...el.querySelectorAll("category")].map(c=>c.getAttribute("term")||c.textContent.trim()).filter(Boolean),
      thumbnail:media?(media.getAttribute("url")||""):""
    };
  }).filter(i=>i.title&&i.link);
}
async function grab(url,ms=15000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),ms);
  try{
    const res=await fetch(url,{signal:controller.signal,cache:"no-store"});
    if(!res.ok) return null;
    return await res.text();
  }catch{return null;}
  finally{clearTimeout(timer);}
}
async function fetchJsonRss(feed){
  // Parametri "lm" ndryshon çdo minutë, që proxy-t të mos kthejnë kopje të vjetër
  const busted=feed+(feed.includes("?")?"&":"?")+"lm="+Math.floor(Date.now()/60000);
  const tries=[
    {kind:"json",url:"https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(busted)},
    {kind:"xml", url:"https://api.allorigins.win/raw?url="+encodeURIComponent(busted)},
    {kind:"xml", url:"https://corsproxy.io/?url="+encodeURIComponent(busted)},
    {kind:"xml", url:"https://api.codetabs.com/v1/proxy/?quest="+encodeURIComponent(busted)},
    {kind:"json",url:"https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(feed)}
  ];
  for(const t of tries){
    const text=await grab(t.url);
    if(!text) continue;
    if(t.kind==="json"){
      try{
        const data=JSON.parse(text);
        const items=data.items||data.entries;
        if(items&&items.length) return items;
      }catch{}
    }else{
      const items=xmlToItems(text);
      if(items.length) return items;
    }
  }
  return [];
}
async function fetchNacionale(){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),12000);
  try{
    const res=await fetch("https://nacionale.com/",{signal:controller.signal,cache:"no-store"});
    if(!res.ok) throw new Error("Nacionale HTTP "+res.status);
    const html=await res.text();
    const urls=[...html.matchAll(/href="(https:\/\/nacionale\.com\/[a-z]+\/[^"#?]+)"/g)].map(m=>m[1]);
    const uniq=[...new Set(urls.map(u=>safeURL(u)).filter(Boolean))].slice(0,10);
    const settled=await Promise.all(uniq.map(async url=>{
      const c=new AbortController();
      const t=setTimeout(()=>c.abort(),8000);
      try{
        const r=await fetch(url,{signal:c.signal,cache:"no-store"});
        if(!r.ok) return null;
        const h=await r.text();
        const title=((h.match(/property="og:title" content="([^"]+)"/)||[])[1]||"").replace(/\s+-\s+NACIONALE.*$/i,"").trim();
        const image=(h.match(/property="og:image" content="([^"]+)"/)||[])[1]||"";
        const desc=(h.match(/property="og:description" content="([^"]+)"/)||[])[1]||"";
        const box=document.createElement("div");
        box.innerHTML=h;
        box.querySelectorAll("script,style,iframe,nav,header,footer,form").forEach(x=>x.remove());
        const paras=[...box.querySelectorAll("p")].map(p=>p.textContent.replace(/\s+/g," ").trim()).filter(s=>s.length>50);
        const text=paras.slice(0,14).join("\n\n")||desc;
        if(!title) return null;
        const published=(h.match(/property="article:published_time" content="([^"]+)"/)||[])[1]||"";
        const summary=(desc||text).slice(0,180);
        const {cat,conf}=classifyItem({title,url,summary,rssCats:[],hint:null});
        return {id:stableId(url),source:"Nacionale",title,url,cat,catConf:conf,
          summary,content:text,body:text,
          image:/^https:\/\//i.test(image)&&!/unsplash/i.test(image)?image:"",
          author:"Nacionale",publishedAt:parseDate(published),previewOnly:text.length<400};
      }catch{return null;}
      finally{clearTimeout(t);}
    }));
    return settled.filter(Boolean);
  }catch{return [];}
  finally{clearTimeout(timer);}
}
async function fetchArticles(feed){
  if(feed.url.startsWith("nacionale:")) return fetchNacionale();
  const items=await fetchJsonRss(feed.url);
  return mapRssItems(feed, items);
}
function readableContent(content, description){
  if(!content) return false;
  const text=strip(content);
  // Reject short excerpts and explicit "continue reading" truncation markers.
  return text.length >= 500 && text.split(/\s+/).length >= 80
    && !/(\[\s*…\s*\]|\[\s*\.\.\.\s*\]|class=["'][^"']*more-link|continue reading|lexo më shumë)/i.test(content);
}
let loadVersion=0;
// ===== RIFRESKIMI AUTOMATIK =====
let initialDone=false, refreshing=false, lastRefresh=0, nextRefresh=0, refreshTimer=null;
function saveCache(){
  try{
    const perCat={};
    const slim=news.filter(n=>{perCat[n.cat]=(perCat[n.cat]||0)+1;return perCat[n.cat]<=40;});
    localStorage.setItem(CACHE_KEY,JSON.stringify(slim));
    localStorage.setItem(CACHE_AT_KEY,String(Date.now()));
  }catch{}
}
// Bashkon lajmet e reja me ato ekzistuese; kthen numrin e lajmeve të reja
function mergeNews(incoming,{prune=true}={}){
  const map=new Map(news.map(n=>[n.url,n]));
  let fresh=0;
  for(const n of incoming){
    const old=map.get(n.url);
    if(!old){
      map.set(n.url,{...n,newAt:initialDone?Date.now():0});
      fresh++;
      continue;
    }
    // kategoria me burim më të sigurt fiton (p.sh. feed-i /sport/ mbi fjalët kyçe)
    const keepOld=(old.catConf||0)>(n.catConf||0);
    map.set(n.url,{...old,...n,cat:keepOld?old.cat:n.cat,catConf:Math.max(old.catConf||0,n.catConf||0),newAt:old.newAt});
  }
  let list=[...map.values()].sort((a,b)=>(Date.parse(b.publishedAt)||0)-(Date.parse(a.publishedAt)||0));
  if(prune){
    const cutoff=Date.now()-MAX_AGE_MS, count={};
    list=list.filter(n=>{
      if(saved.has(n.id)) return true;
      if((Date.parse(n.publishedAt)||0)<cutoff) return false;
      count[n.cat]=(count[n.cat]||0)+1;
      return count[n.cat]<=MAX_PER_CAT;
    });
  }
  news=list;
  saveCache();
  return fresh;
}
function isNew(n){ return n.newAt && Date.now()-n.newAt<15*60000; }
function scheduleNext(){
  clearTimeout(refreshTimer);
  nextRefresh=Date.now()+REFRESH_MS;
  refreshTimer=setTimeout(()=>refreshAll({silent:true}),REFRESH_MS);
}
async function refreshAll(opts={}){
  const silent=!!opts.silent;
  if(refreshing) return;
  // kur aplikacioni është në sfond nuk harxhojmë kërkesa; rifreskohet kur rikthehesh
  if(silent && document.hidden){ scheduleNext(); return; }
  refreshing=true; updateRefreshInfo();
  if(!silent && !news.length){ loading=true; render(); }
  $("loadStatus").textContent=silent?"Duke kontrolluar lajme të reja…":"Duke ngarkuar lajmet e fundit nga të gjitha burimet…";
  let fresh=0, ok=false, okFeeds=0;
  try{
    // nga 3 burime njëherësh, që proxy-t të mos na kufizojnë
    const incoming=[];
    for(let i=0;i<FEEDS.length;i+=3){
      const batch=await Promise.all(FEEDS.slice(i,i+3).map(f=>fetchArticles(f).catch(()=>[])));
      batch.forEach(b=>{ if(b&&b.length){okFeeds++; incoming.push(...b);} });
      if(incoming.length && !news.length){ mergeNews(incoming.slice()); render(); }
    }
    ok=incoming.length>0;
    if(ok) fresh=mergeNews(incoming);
  }finally{
    refreshing=false; loading=false; initialDone=true;
    lastRefresh=Date.now(); scheduleNext();
  }
  const where=category==="all"?"":" ("+labels[category]+")";
  $("loadStatus").textContent=ok
    ? (fresh?"U gjetën "+fresh+" lajme të reja nga "+okFeeds+" burime. Kontrolli i radhës pas 3 min.":"Nuk ka lajme të reja"+where+" ("+okFeeds+" burime). Kontrolli i radhës pas 3 min.")
    : "Asnjë burim nuk u përgjigj. Riprovohet automatikisht pas 3 min.";
  if(sourceFilter!=="all" && !activeSources().includes(sourceFilter)) sourceFilter="all";
  chips();render();renderSaved();renderSourceList();updateRefreshInfo();
}
function updateRefreshInfo(){
  const el=$("refreshInfo"); if(!el) return;
  if(refreshing){el.textContent="Duke kërkuar lajme të reja…";return;}
  if(!lastRefresh){el.textContent="Artikuj nga të gjitha burimet";return;}
  const left=Math.max(0,Math.round((nextRefresh-Date.now())/1000));
  const hhmm=new Date(lastRefresh).toLocaleTimeString("sq",{hour:"2-digit",minute:"2-digit"});
  el.textContent="Përditësuar "+hhmm+" · tjetri pas "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
}
function stableId(url){
  let hash=2166136261;
  for(const c of url) hash=Math.imul(hash^c.charCodeAt(0),16777619);
  return hash>>>0;
}
function renderSourceList(){
  const q=$("sourceSearch").value.toLowerCase();
  $("sourceList").innerHTML=activeSources().filter(n=>n.toLowerCase().includes(q))
    .map(n=>`<li><button class="bm" style="line-height:1.5" data-source-select="${esc(n)}">${esc(n)}</button></li>`).join("")
    || `<li>${loading?"Duke kontrolluar burimet…":"Nuk ka burime të disponueshme."}</li>`;
}

document.addEventListener("click",e=>{
  const open=e.target.closest("[data-open]");
  const save=e.target.closest("[data-save]");
  const close=e.target.closest("[data-close]");
  if(open){
    e.preventDefault();
    openArticle(Number(open.dataset.open));
  }
  if(save){
    e.preventDefault();
    e.stopPropagation();
    const id=Number(save.dataset.save);
    toggleSave(id);
    if($("articleDialog").open) openArticle(id);
  }
  const share=e.target.closest("[data-share]");
  if(share){
    e.preventDefault();
    e.stopPropagation();
    shareArticle(Number(share.dataset.share));
  }
  const featDir=e.target.closest("[data-feat-dir]");
  if(featDir){
    e.preventDefault();e.stopPropagation();
    const dots=document.querySelectorAll(".feat-dots button");
    const count=dots.length||1;
    featIndex=(featIndex+Number(featDir.dataset.featDir)+count)%count;
    startFeatRotate(count);
    const track=$("featTrack");
    if(track) track.style.transform="translateX(-"+featIndex*100+"%)";
    const num=$("featNum");
    if(num) num.textContent=String(featIndex+1).padStart(2,"0")+" / "+String(count).padStart(2,"0");
    dots.forEach((b,i)=>b.classList.toggle("on",i===featIndex));
  }
  const featGo=e.target.closest("[data-feat-go]");
  if(featGo){
    e.preventDefault();e.stopPropagation();
    const dots=document.querySelectorAll(".feat-dots button");
    featIndex=Number(featGo.dataset.featGo);
    const track=$("featTrack");
    if(track) track.style.transform="translateX(-"+featIndex*100+"%)";
    const num=$("featNum");
    if(num) num.textContent=String(featIndex+1).padStart(2,"0")+" / "+String(dots.length).padStart(2,"0");
    dots.forEach((b,i)=>b.classList.toggle("on",i===featIndex));
    startFeatRotate(dots.length);
  }
  const copy=e.target.closest("[data-copy-link]");
  if(copy){
    const link=copy.dataset.copyLink;
    navigator.clipboard.writeText(link).then(()=>toast("Linku u kopjua.")).catch(()=>toast(link));
  }
  if(close){
    const el=$(close.dataset.close);
    if(el && el.close) el.close();
  }
});
