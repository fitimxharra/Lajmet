<script>
function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  const dark=theme==='dark';
  const button=document.getElementById('themeToggle');
  button.setAttribute('aria-pressed',String(dark));
  button.setAttribute('aria-label',dark?'Aktivizo pamjen e bardhë':'Aktivizo pamjen e errët');
  button.title=dark?'Pamja e bardhë':'Pamja e errët';
  document.getElementById('themeColor').content=dark?'#151715':'#f5f3ee';
}
applyTheme(document.documentElement.dataset.theme);
document.getElementById('themeToggle').addEventListener('click',()=>{
  const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
  applyTheme(theme);
  try{localStorage.setItem('newsTheme',theme);}catch{}
});
// Confirmed RSS endpoint with readable article content and CORS support.
const feedCandidates = [
  ["Reporteri","https://reporteri.net/feed/","national"],
  ["KultPlus","https://www.kultplus.com/feed/","culture"],
  ["Telegrafi","https://telegrafi.com/feed/","national"],
  ["Gazeta Express","https://www.gazetaexpress.com/feed/","national"],
  ["Nacionale","nacionale:home","national"]
];
let news = [];
try {
  const cached=JSON.parse(localStorage.getItem("readableNewsCacheV1")||"[]");
  const cachedAt=Number(localStorage.getItem("readableNewsCacheAtV1")||"0");
  const freshEnough=Date.now()-cachedAt < 8*60*1000;
  if(freshEnough && Array.isArray(cached)) news=cached.filter(n=>n&&n.title&&safeURL(n.url));
} catch {}
let loading = true;
function itemText(n){ return ((((n&&n.title)||"")+" "+((n&&n.url)||"")).toLowerCase()); }
function isSportItem(n){
  const x=itemText(n)+" "+(((n&&n.tags)||"")).toLowerCase();
  return /\bsport\b|\/sport\/|futboll|basketboll|\bbasket\b|superliga|premier\s?lig|\btenis|volejb|ndeshj|kampionat|formula\s?1|olimpik|atletik|handboll|\bufc\b|trajner|stadium|\bgol\b|\bklubi\b|dardan|zidane|ronaldo|messi|mbappe|xhaka|foda|bayern|madrid|barcelona|liverpool|juventus|chelsea|arsenal|united|psg\b|real\s+madrid|fifa|uefa|euro\s?202|bot[eë]ror/.test(x);
}
function isWorldItem(n){
  const x=itemText(n);
  return /(\/bote\/|\/botë\/|\/world\/|\/globale\/)|\bndërkomb|\bnderkomb|ukrain|\brusi|\bmosk[eë]|\bnato\b|washington|zelensky/.test(x);
}
function isCultureItem(n){
  const x=itemText(n);
  return /(\/kultur|\/kultura\/)|\bmuzik|\bfilm\b|\bteat[eë]r|\bfestival|\bkoncert|\bpiktur|kultplus/.test(x);
}
function belongsToCategory(n,cat){
  if(cat==="sport") return isSportItem(n);
  if(cat==="world") return isWorldItem(n);
  if(cat==="culture") return isCultureItem(n);
  if(cat==="national") return !isSportItem(n) && !isCultureItem(n);
  return true;
}
function activeSources(){
  const pool=category==="all"?news:news.filter(n=>n.cat===category);
  return [...new Set(pool.map(n=>n.source))];
}
const labels={national:"Lajme",world:"Botë",sport:"Sport",culture:"Kulturë"};
let category="all", sourceFilter="all";
let saved; let savedArticles={};
try{
  saved=new Set(JSON.parse(localStorage.getItem("savedReadableNewsV2")||"[]"));
  savedArticles=JSON.parse(localStorage.getItem("savedReadableNewsArticlesV1")||"{}")||{};
}catch{saved=new Set();savedArticles={}}
function persistSaved(){
  try{
    localStorage.setItem("savedReadableNewsV2",JSON.stringify([...saved]));
    localStorage.setItem("savedReadableNewsArticlesV1",JSON.stringify(savedArticles));
  }catch{}
}
function toggleSave(id){
  const n=news.find(x=>x.id===id)||savedArticles[id];
  if(saved.has(id)){
    saved.delete(id);
    delete savedArticles[id];
  }else{
    saved.add(id);
    if(n) savedArticles[id]=n;
  }
  persistSaved();

function interleaveByCategory(items){

  items.forEach(n=>{
    const k=n.cat||"national";
    (groups[k]||(groups[k]=[])).push(n);

  const keys=Object.keys(groups);
  const out=[];

  while(added){

function trendScore(n, pool){

  let s=Math.max(0,36-h)*3;

    "https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(feed)
  ];

    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),15000);

      if(!response.ok) continue;
      const data=await response.json();

  }

          summary:(desc||text).slice(0,180),content:text,body:text,
          image:/^https:\/\//i.test(image)&&!/unsplash/i.test(image)?image:"",
          author:"Nacionale",publishedAt:new Date().toISOString(),previewOnly:text.length<400};
      }catch{return null;}
      finally{clearTimeout(t);}
    }));
    return settled.filter(Boolean);
  }catch{return [];}
  finally{clearTimeout(timer);}
}
async function fetchArticles(src, feed, fallbackCategory){
  if(String(feed).startsWith("nacionale:")) return fetchNacionale();
  const items=await fetchJsonRss(feed);
  return mapRssItems(src, items, fallbackCategory);
}
function readableContent(content, description){
  if(!content) return false;
  const text=strip(content);
  // Reject short excerpts and explicit "continue reading" truncation markers.
  return text.length >= 500 && text.split(/\s+/).length >= 80
    && !/(\[\s*…\s*\]|\[\s*\.\.\.\s*\]|class=["'][^"']*more-link|continue reading|lexo më shumë)/i.test(content);
}
let loadVersion=0;
async function loadLive(opts={}){
  const silent=!!opts.silent;
  const version=++loadVersion;
  if(!silent){
    loading=true;
    $("loadStatus").textContent="Duke ngarkuar artikujt e fundit…";
    render();
  }else{
    $("loadStatus").textContent="Duke kontrolluar lajme të reja…";
  }
  const extra=Object.entries(categoryFeeds).flatMap(([cat,feeds])=>feeds.map(([src,feed])=>[src,feed,cat]));
  const allFeeds=[...feedCandidates,...extra];
  const batches=await Promise.all(allFeeds.map(async ([src,feed,cat])=>{
    try{
      if(String(feed).startsWith("nacionale:")){
        const items=await fetchArticles(src,feed,cat);
        return items;
      }
      const items=await fetchArticles(src,feed,"national");
      return items.map(n=>({...n,cat:classify(n)}));
    }catch{return [];}
  }));
  if(version!==loadVersion) return;
  opts._before=news.slice();
  const incoming=[...new Map(batches.flat().map(n=>[n.url,n])).values()]
    .sort((a,b)=>(Date.parse(b.publishedAt)||0)-(Date.parse(a.publishedAt)||0));
  if(incoming.length){
    const savedKeep=news.filter(n=>saved.has(n.id) && !incoming.some(x=>x.url===n.url));
    news=[...incoming.map(n=>({...n,cat:classify(n)})),...savedKeep].slice(0,80);
    try{
      localStorage.setItem("readableNewsCacheV1",JSON.stringify(news));
      localStorage.setItem("readableNewsCacheAtV1",String(Date.now()));
    }catch{}
  }
  const known=new Set((opts._before||[]).map(n=>n.url));
  const fresh=incoming.filter(n=>!known.has(n.url)).length;
  $("loadStatus").textContent=incoming.length
    ? (silent
        ? (fresh?("U gjetën "+fresh+" lajme të reja."):"Nuk ka lajme të reja. Kontrolli i radhës pas 3 min.")
        : "U ngarkuan artikujt e fundit. Kontroll automatik çdo 3 min.")
    : (silent?"Kontrolli dështoi. Riprovohet pas 3 min.":"Lidhja me burimin dështoi. Provo Rifresko.");
  loading=false;
  if(sourceFilter!=="all" && !activeSources().includes(sourceFilter)) sourceFilter="all";
  chips();render();renderSaved();renderSourceList();
}
function stableId(url){
  let hash=2166136261;
  for(const c of url) hash=Math.imul(hash^c.charCodeAt(0),16777619);
  return hash>>>0;
}
function renderSourceList(){
  const q=$("sourceSearch").value.toLowerCase();
  $("sourceList").innerHTML=activeSources().filter(n=>n.toLowerCase().includes(q))
    .map(n=>`<li><button class="bm" style="line-height:1.5" data-source-select="${esc(n)}">${esc(n)}</button></li>`).join("")
    || `<li>${loading?"Duke kontrolluar burimet…":"Nuk ka burime të disponueshme."}</li>`;
}

document.addEventListener("click",e=>{
  const open=e.target.closest("[data-open]");
  const save=e.target.closest("[data-save]");
  const close=e.target.closest("[data-close]");
  if(open){
    e.preventDefault();
    openArticle(Number(open.dataset.open));
  }
  if(save){
    e.preventDefault();
    e.stopPropagation();
    const id=Number(save.dataset.save);
    toggleSave(id);
    if($("articleDialog").open) openArticle(id);
  }
  const share=e.target.closest("[data-share]");
  if(share){
    e.preventDefault();
    e.stopPropagation();
    shareArticle(Number(share.dataset.share));
  }
  const featDir=e.target.closest("[data-feat-dir]");
  if(featDir){
    e.preventDefault();e.stopPropagation();
    const dots=document.querySelectorAll(".feat-dots button");
    const count=dots.length||1;
    featIndex=(featIndex+Number(featDir.dataset.featDir)+count)%count;
    startFeatRotate(count);
    const track=$("featTrack");
    if(track) track.style.transform="translateX(-"+featIndex*100+"%)";
    const num=$("featNum");
    if(num) num.textContent=String(featIndex+1).padStart(2,"0")+" / "+String(count).padStart(2,"0");
    dots.forEach((b,i)=>b.classList.toggle("on",i===featIndex));
  }
  const featGo=e.target.closest("[data-feat-go]");
  if(featGo){
    e.preventDefault();e.stopPropagation();
    const dots=document.querySelectorAll(".feat-dots button");
    featIndex=Number(featGo.dataset.featGo);
    const track=$("featTrack");
    if(track) track.style.transform="translateX(-"+featIndex*100+"%)";
    const num=$("featNum");
    if(num) num.textContent=String(featIndex+1).padStart(2,"0")+" / "+String(dots.length).padStart(2,"0");
    dots.forEach((b,i)=>b.classList.toggle("on",i===featIndex));
    startFeatRotate(dots.length);
  }
  const copy=e.target.closest("[data-copy-link]");
  if(copy){
    const link=copy.dataset.copyLink;
    navigator.clipboard.writeText(link).then(()=>toast("Linku u kopjua.")).catch(()=>toast(link));
  }
  if(close){
    const el=$(close.dataset.close);
    if(el && el.close) el.close();
  }
});
